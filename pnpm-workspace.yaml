packages:
  - 'packages/*'
  - 'docs'

# Patch application failures fail the install CLOSED (never silently skipped) —
# the markdown pipeline depends on the pinned/patched remark-prosemirror hunks.
ignorePatchFailures: false

# Supply-chain cooldown (admission-time): refuse npm versions published less
# than 3 days ago, to dodge freshly-published malware. Unit = MINUTES
# (4320 = 3 days). Own-org packages (@inkeep/*) are exempt. This replaces the
# retired bunfig.toml posture (which expressed the same window in seconds:
# minimumReleaseAge = 259200). Emergency reproduction escape hatch (bypass the
# cooldown for a single install): `pnpm install --config.minimum-release-age=0`.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@inkeep/*'
  - '@visimer/*'

# Dependency build scripts are blocked by default under pnpm; only these run.
# electron ships no install script of its own as of 43 — it fetches its platform
# binary lazily on first use instead — but the entry stays so a future release
# that reintroduces one is not silently blocked. The napi native addon
# (@inkeep/open-knowledge-native-config) builds via its own turbo `napi build`
# task, not a dependency install script, so it needs no entry here. node-pty
# publishes N-API prebuilds for the supported desktop platforms; its install
# script remains allowlisted as a source-build fallback when no matching
# prebuild is present.
onlyBuiltDependencies:
  - electron
  - node-pty

overrides:
  # --- Security advisories (Dependabot). Each floor is a `~` range, so a later
  # patch advisory on the same line self-heals without another override edit,
  # and nothing floats to a new minor as a side effect of a security fix.
  #
  # A `~` is a CEILING as well as a floor, and these are NOT covered by
  # `scripts/check-override-floors.mjs`, which reasons only about exact pins.
  # `@opentelemetry/core@2` sits under packages/app's `^2.9.0` today for that
  # reason. Check by hand when adding one.
  #
  # THREE entries deliberately cross a breaking boundary, because the vulnerable
  # version is the last release on its line and there is no in-line fix at all:
  #   nanoid@4  -> 5.x   (4.0.2 is the final 4.x; consumer
  #                       @excalidraw/mermaid-to-excalidraw pins it exactly at
  #                       4.0.2, and calls `nanoid()` with no arguments, so the
  #                       bad-`size` advisories were never reachable there)
  #   sharp@0.34 -> 0.35 (0.34.5 is the final 0.34.x; consumer next declares
  #                       ^0.34.5 as an optionalDependency. 0.35.0 is breaking:
  #                       retuned lossy AVIF defaults, new limitInputChannels
  #                       default, removed install script. It is next/image's
  #                       optimizer on the docs site, so emitted image bytes can
  #                       change even though no API does)
  #   esbuild@0.27 -> 0.28 (0.27.7 is the final 0.27.x; consumer fumadocs-mdx
  #                       declares ^0.27.0. Gates the docs build, so a real
  #                       incompatibility fails loudly)
  # On 0.x packages the minor is the breaking axis, so those two are majors in
  # effect. pnpm applies an out-of-range override silently; these are the ones
  # that would not surface on their own.
  #
  # `next` is floored at the advisory patch line rather than its declared `^16`
  # caret, to keep this a security-only change (a bare caret takes it to 16.3.x).
  #
  # `vite` is deliberately absent. 8.0.16 pulls rolldown 1.0.0-rc.15 -> 1.0.3,
  # which re-partitions chunks and moves ~253 kB gzipped into the app's main
  # entry (423.8 kB -> 676.8 kB, over the 487 kB size-limit). Its two advisories
  # are dev-server-only on Windows and never reach a shipped artifact. Tracked
  # for unpinning in PRD-8169. ---
  '@babel/core@7': ~7.29.6
  '@hono/node-server@1': ~1.19.15
  '@opentelemetry/core@2': ~2.8.0
  'brace-expansion@1': ~1.1.18
  'brace-expansion@2': ~2.1.4
  'builder-util-runtime@9': ~9.7.0
  'dompurify@3': ~3.4.13
  'esbuild@0.27': ~0.28.1
  'fast-uri@3': ~3.1.5
  'fast-xml-parser@5': ~5.10.1
  'hono@4': ~4.12.34
  'ip-address@10': ~10.3.1
  'js-yaml@3': ~3.15.1
  'js-yaml@4': ~4.3.1
  'lodash-es@4': ~4.18.0
  'mermaid@11': ~11.16.1
  'nanoid@3': ~3.3.18
  'nanoid@4': ~5.1.16
  'nanoid@5': ~5.1.16
  'next@16': ~16.2.11
  'postcss@8': ~8.5.23
  'sharp@0.34': ~0.35.0
  'tar@7': ~7.5.21
  'undici@6': ~6.28.0
  'undici@7': ~7.29.0
  # CodeMirror is the source-mode editor core. Freezing `view` is the point of
  # this pair, for the same reason the `@tiptap/*` + `prosemirror-*` pins below
  # exist: an unpinned editor core floats on every install. `state` is pinned
  # alongside it only to keep the pair explicit, so it carries whatever version
  # the frozen `view` requires rather than a stale one of its own.
  #
  # That version has a hard floor of 6.7.0. Both `@codemirror/view@6.43.3` and
  # `@codemirror/commands@6.10.4` declare `"@codemirror/state": "^6.7.0"`, and
  # view calls `EditorSelection.undirectionalRange`, which 6.6.0 does not define.
  # pnpm applies an out-of-range override silently, so pinning under that floor
  # throws `TypeError: undirectionalRange is not a function` at runtime on every
  # mouse-selection path (double-click word select, triple-click line select,
  # atomic-range selection filter, widget dragstart) in every CodeMirror-backed
  # surface in the app. `scripts/check-override-floors.mjs` now fails the build
  # rather than letting that recur. When `view` is bumped, re-read its declared
  # `@codemirror/state` range and raise this to match.
  '@codemirror/state': 6.7.1
  '@codemirror/view': 6.43.3
  # Radix UI graph pinned to the versions the bun lockfile resolved. A fresh
  # pnpm resolution floats the whole @radix-ui/* + floating-ui graph past the
  # bun baseline (e.g. react-dialog 1.1.15 -> 1.1.19, react-presence 1.1.6 ->
  # 1.1.7, react-primitive 2.1.6 -> 2.1.7); the newer dialog/presence/
  # dismissable-layer stack shifts effect + timer flush ordering enough to break
  # timing-sensitive DOM tests (ShareBranchSwitchDialog toast, CreateProjectDialog
  # polling). This toolchain cutover must be behavior-preserving, so the runtime
  # Radix graph is held at the bun baseline. Revisit as a deliberate, separately
  # tested upgrade -- not as a side effect of the package-manager swap.
