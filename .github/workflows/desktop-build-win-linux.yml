name: Desktop build (manual, Windows/Linux)

# Manual, artifact-only Windows + Linux desktop builds (spec
# 2026-07-16-desktop-windows-linux-port, D6): nothing here publishes,
# tags, or touches the release cadence — the operator downloads the
# installers from the run's artifacts for VM/hardware QA. The release
# path is desktop-release.yml, which builds these same targets signed
# and publishes them; this workflow stays the non-publishing QA lane.
#
# Topology: one `prepare` job on ubuntu builds the workspace (the CLI
# build chain uses `cp -r`/`mkdir -p` bash-isms that don't survive a
# Windows runner's default shell, and this also keeps the packaging
# jobs from redundantly rebuilding identical platform-neutral JS), then
# per-OS jobs do only the platform-specific half: electron-vite build +
# electron-builder against the prebuilt cli/dist. The Linux job is a
# two-cell matrix — x64 on `ubuntu-latest`, arm64 on the native
# `ubuntu-24.04-arm` runner — so each `.deb` carries prebuilt natives for
# the arch it targets.
#
# Artifacts are one-per-installer, each named for the file it holds
# (OpenKnowledge-Setup-x64 / -arm64, OpenKnowledge-amd64-deb / -arm64-deb,
# OpenKnowledge-x86_64-rpm / -aarch64-rpm) so an operator can grab just
# the one they're about to QA. GitHub zips artifacts on download either
# way.
#
# Windows signing (D3, Azure Artifact Signing): OPTIONAL here. When the
# three AZURE_* secrets + four AZURE_SIGNING_* repo variables are
# configured, the Windows job passes win.azureSignOptions to
# electron-builder; when absent it builds unsigned (acceptable for
# internal QA only — unsigned Windows builds are never published, and
# this workflow cannot publish by construction).
#
# afterPack/afterSign flip + verify the Electron fuses on every platform
# (D9) — RunAsNode must be enabled or the bundled `ok` CLI wrappers and
# the detached-server spawn silently break in packaged builds.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which platforms to build"
        required: true
        type: choice
        default: both
        options: [both, windows, linux]

permissions:
  contents: read
  # `gh run download` of the native-config prebuild artifact.
  actions: read

concurrency:
  group: desktop-build-win-linux-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-ok-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-ok-pnpm-store-

      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-desktop-manual-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-desktop-manual-
            ${{ runner.os }}-turbo-desktop-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Best-effort staging of the 8-target native-config prebuilt set
      # (mirrors release.yml's step in spirit, but always degrades instead
      # of failing: these are QA artifacts, not published releases, and the
      # smol-toml fallback keeps the CLI functional without the addon —
      # only the Codex TOML write degrades to a decline). The host `napi
      # build` below still produces the linux-x64 binary either way.
      - name: Stage native-config prebuilt binaries (best-effort)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          run_id=$(gh run list --workflow=native-config-prebuild.yml --branch main --event push \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)
          if [ -z "$run_id" ]; then
            echo "::warning::no successful native-config-prebuild run found; win/arm64 targets ship without the toml_edit addon (smol-toml fallback)"
            exit 0
          fi
          if ! gh run download "$run_id" --name native-config-bindings-all --dir /tmp/nc-bindings; then
            echo "::warning::could not download native-config-bindings-all from run $run_id; continuing with host binary only"
            exit 0
          fi
          find /tmp/nc-bindings -name '*.node' -exec cp -f {} packages/native-config/ \;
          count=$(find packages/native-config -maxdepth 1 -name '*.node' | wc -l | tr -d ' ')
          echo "staged $count native-config prebuilt binaries from run $run_id"

      # The workspace build produces native-config's host `.node` via `napi
      # build` (turbo dep of the cli build), which needs a Rust toolchain —
      # mirror release.yml's explicit pin.
      - name: Setup Rust toolchain for the native-config build
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      # Same two-filter sequencing as desktop-release.yml: app must build
      # before cli's build:assets copies app/dist into cli/dist/public.
      - name: Build workspace (produces packages/cli/dist for extraResources)
        run: |
          pnpm exec turbo run build --filter=@inkeep/open-knowledge-app
          pnpm exec turbo run build --filter=@inkeep/open-knowledge

      # Hand the platform-neutral build products to the packaging jobs:
      # the full bundled CLI tree + core/server dist + the native-config addon
      # dir the electron-builder `../native-config` extraResources rule reads
      # (index.js loader + package.json + every staged .node).
      #
      # core/server dist are load-bearing: `build:desktop` (electron-vite) in
      # the packaging jobs bundles the desktop main process + app renderer
      # source, which import `@inkeep/open-knowledge-core` and
      # `@inkeep/open-knowledge-server`. Those resolve via `exports` to
      # `./dist/index.mjs`; without the built dist here, electron-vite fails
      # with "Rolldown failed to resolve import @inkeep/open-knowledge-core".
      # The packaging jobs can't rebuild them (the Windows job's default shell
      # can't run the CLI build chain's `cp -r` bash-isms), so prepare builds
      # everything once and ships the dist forward.
      - name: Upload workspace bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-bundle
          path: |
            packages/cli/dist/
            packages/core/dist/
            packages/server/dist/
            packages/native-config/index.js
            packages/native-config/index.d.ts
            packages/native-config/*.node
          retention-days: 3
          if-no-files-found: error

  build-windows:
    if: inputs.platforms == 'both' || inputs.platforms == 'windows'
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-ok-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-ok-pnpm-store-

      - name: Install dependencies
        env:
          # Rebuild native modules against Electron's Node ABI — mirrors
          # desktop-release.yml.
          ELECTRON_SKIP_REBUILD: "0"
        run: pnpm install --frozen-lockfile

      - name: Download workspace bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v5.0.0
        with:
          name: workspace-bundle
          path: packages/

      # Both keyring arch prebuilds (x64 + arm64) must be present in the
      # hoisted node_modules before electron-builder copies them into
      # cli/node_modules (win.extraResources) — pnpm installed only the
      # host-matching one.
      - name: Prepare cross-arch keyring prebuilds
        working-directory: packages/desktop
        run: node scripts/prepare-platform-natives.mjs

      # Stage @parcel/watcher onto the bundled CLI's module path. This workflow
      # invokes electron-builder directly (not the build:win/build:linux npm
      # scripts, which DO run this), so the step must be explicit here or the
      # packaged app ships without @parcel/watcher on the CLI path and the
      # server degrades to chokidar (#760). Stages only the host-arch binary
      # today; the other-arch artifact uses the (subfolder-correct) chokidar
      # fallback — see scripts/stage-parcel-watcher.mjs.
      - name: Stage @parcel/watcher for the bundled CLI
        working-directory: packages/desktop
        run: node scripts/stage-parcel-watcher.mjs

      - name: Build desktop main/preload/renderer
        working-directory: packages/desktop
        run: pnpm run build:desktop

      # Signing is optional (see header). Secrets: AZURE_TENANT_ID /
      # AZURE_CLIENT_ID / AZURE_CLIENT_SECRET; repo variables:
      # AZURE_SIGNING_ENDPOINT / AZURE_SIGNING_ACCOUNT / AZURE_SIGNING_PROFILE
      # / AZURE_SIGNING_PUBLISHER (Azure Trusted Signing endpoint URL,
      # code-signing account name, certificate profile name, certificate
      # subject CN — procurement outputs). All FOUR azureSignOptions fields
      # are schema-required (app-builder-lib WindowsAzureSigningConfiguration
      # .required) — passing a subset fails validateConfig before packaging,
      # so the signed branch requires the full set and PUBLISHER joins the
      # presence check.
      - name: Package NSIS installers (x64 + arm64)
        id: package-windows
        working-directory: packages/desktop
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
        run: |
          set -euo pipefail
          extra=()
          if [[ -n "${AZURE_TENANT_ID:-}" && -n "${AZURE_CLIENT_ID:-}" && -n "${AZURE_CLIENT_SECRET:-}" && -n "${AZURE_SIGNING_ENDPOINT:-}" && -n "${AZURE_SIGNING_ACCOUNT:-}" && -n "${AZURE_SIGNING_PROFILE:-}" && -n "${AZURE_SIGNING_PUBLISHER:-}" ]]; then
            echo "::notice::Azure Trusted Signing credentials present — building SIGNED installers."
            echo "signing_requested=true" >> "$GITHUB_OUTPUT"
            extra+=(
              "--config.win.azureSignOptions.endpoint=${AZURE_SIGNING_ENDPOINT}"
              "--config.win.azureSignOptions.codeSigningAccountName=${AZURE_SIGNING_ACCOUNT}"
              "--config.win.azureSignOptions.certificateProfileName=${AZURE_SIGNING_PROFILE}"
              "--config.win.azureSignOptions.publisherName=${AZURE_SIGNING_PUBLISHER}"
            )
          else
            echo "::warning::No (complete) Azure signing config — building UNSIGNED installers (internal QA only; never distribute)."
            echo "signing_requested=false" >> "$GITHUB_OUTPUT"
          fi
          pnpm exec electron-builder --win --publish never "${extra[@]}"

      - name: Attest signed Windows packages and preserved Microsoft signatures
        id: attest-windows-signing
        if: ${{ !cancelled() && steps.package-windows.outputs.signing_requested == 'true' }}
        shell: pwsh
        working-directory: packages/desktop
        env:
          OK_SIGNING_REQUESTED: ${{ steps.package-windows.outputs.signing_requested }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:OK_SIGNING_REQUESTED -ne 'true') {
            throw 'Signature rider ran without a signing-enabled package step.'
          }

          $packages = @(
            [pscustomobject]@{ Arch = 'x64'; Path = 'dist-desktop/win-unpacked' },
            [pscustomobject]@{ Arch = 'arm64'; Path = 'dist-desktop/win-arm64-unpacked' }
          )
          foreach ($package in $packages) {
            if (-not (Test-Path -LiteralPath $package.Path -PathType Container)) {
              throw "Signing-enabled build produced no $($package.Arch) outer package at $($package.Path)."
            }

            $appExecutable = Join-Path $package.Path 'OpenKnowledge.exe'
            if (-not (Test-Path -LiteralPath $appExecutable -PathType Leaf)) {
              throw "Signing-enabled $($package.Arch) package has no OpenKnowledge.exe."
            }
            $signature = Get-AuthenticodeSignature $appExecutable
            if ($signature.Status -ne 'Valid') {
              throw "Our signing pass did not leave a valid signature on ${appExecutable}: $($signature.Status)"
            }

            $pairDirectories = @(Get-ChildItem $package.Path -Recurse -Directory -Filter 'conpty' |
              Where-Object { $_.FullName -match 'node-pty[\\/]prebuilds[\\/]win32-(x64|arm64)[\\/]conpty$' })
            if ($pairDirectories.Count -ne 2) {
              throw "Expected both ConPTY architecture directories in the $($package.Arch) package; found $($pairDirectories.Count)."
            }
            foreach ($directory in $pairDirectories) {
              foreach ($name in @('conpty.dll', 'OpenConsole.exe')) {
                $path = Join-Path $directory.FullName $name
                if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Packaged Microsoft ConPTY pair is incomplete: $path"
                }
                $signature = Get-AuthenticodeSignature $path
                if ($signature.Status -ne 'Valid') {
                  throw "Microsoft signature is not valid on ${path}: $($signature.Status)"
                }
                if ($signature.SignerCertificate.Subject -notmatch 'Microsoft') {
                  throw "Expected the original Microsoft signer on ${path}; got $($signature.SignerCertificate.Subject)"
                }
              }
            }
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'signing_ran=true'
          "### Windows signature rider: PASSED`n`nBoth outer architectures carry a signed app, and Microsoft signatures remain valid on every packaged ConPTY pair." |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Require completed Windows signing attestation
        if: ${{ !cancelled() && steps.package-windows.outputs.signing_requested == 'true' }}
        shell: pwsh
        env:
          OK_SIGNING_RAN: ${{ steps.attest-windows-signing.outputs.signing_ran }}
        run: |
          if ($env:OK_SIGNING_RAN -ne 'true') {
            throw 'Azure signing was requested, but both signed outer packages were not attested.'
          }

      - name: Report Windows signature rider skipped
        if: ${{ !cancelled() && steps.package-windows.outputs.signing_requested != 'true' }}
        shell: pwsh
        run: |
          "### Windows signature rider: SKIPPED`n`nThis dispatch built unsigned QA artifacts, so the post-signature rider did not run and must not be read as green evidence." |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Assert Windows x64 terminal native package compatibility
        working-directory: packages/desktop
        env:
          OK_WIN_PACKAGE_DIR: dist-desktop/win-unpacked
          OK_WIN_PACKAGE_REQUIRED: "1"
        run: pnpm exec vitest run tests/unit/windows-package-native-guards.test.ts

      - name: Assert Windows arm64 terminal native package compatibility
        working-directory: packages/desktop
        env:
          OK_WIN_PACKAGE_DIR: dist-desktop/win-arm64-unpacked
          OK_WIN_PACKAGE_REQUIRED: "1"
        run: pnpm exec vitest run tests/unit/windows-package-native-guards.test.ts

      # Fail before uploading an installer that cannot start. An asar packed
      # without `node_modules` produces a binary that dies on its first bare
      # import, before `app.ready` — no window, no dialog — so an operator
      # downloading this artifact for QA would see only "nothing happens".
      - name: Assert the packaged asar carries its dependencies
        working-directory: packages/desktop
        run: node scripts/assert-asar-complete.mjs dist-desktop "windows installers"

      # One artifact per installer, each named for the file it carries, so the
      # operator downloads only the arch they're about to QA instead of pulling
      # both installers plus metadata as one blob. GitHub zips every artifact on
      # download regardless, so this is a naming/selection win, not a way to
      # skip unzipping. The `.exe.blockmap` glob rides along with its installer
      # and is absent today (`nsis.differentialPackage: false`) — a per-arch
      # glob keeps `if-no-files-found: error` meaningful (the `.exe` still
      # matches) while staying correct if differential packaging is restored.
      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenKnowledge-Setup-x64
          path: packages/desktop/dist-desktop/*Setup-x64.exe*
          retention-days: 14
          if-no-files-found: error

      - name: Upload Windows arm64 installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenKnowledge-Setup-arm64
          path: packages/desktop/dist-desktop/*Setup-arm64.exe*
          retention-days: 14
          if-no-files-found: error

      # electron-updater's Windows manifest covers BOTH arches in one file, so
      # it can't ride along with a single installer — it gets its own (tiny)
      # artifact.
      - name: Upload Windows update metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenKnowledge-windows-update-metadata
          path: packages/desktop/dist-desktop/latest.yml
          retention-days: 14
          if-no-files-found: error

  # Two cells, each on a NATIVE runner for its arch. Cross-compiling the arm64
  # native deps from an x64 host is impractical (pnpm installs only the
  # host-matching `@parcel/watcher-*` prebuild, and the Linux build skips
  # @electron/rebuild by design — see electron-builder.linux.yml), so
  # the arm64 deb is built on GitHub's arm64 Linux runner where pnpm installs
  # the arm64 prebuilds directly and `scripts/stage-parcel-watcher.mjs` stages
  # the right binary.
  #
  # deb-only: the AppImage was cut 2026-07-31 — its runtime needs FUSE 2,
  # which no current mainstream distro ships (both arches failed stock
  # Debian 13 in real-VM QA). Linux updates are the package manager's job;
  # electron-builder.yml carries the full rationale.
  build-linux:
    if: inputs.platforms == 'both' || inputs.platforms == 'linux'
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      # One arch failing must not cancel the other — the operator can still QA
      # whichever installer built.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
            targets: deb:x64 rpm:x64
            unpacked_dir: linux-unpacked
          - runner: ubuntu-24.04-arm
            arch: arm64
            targets: deb:arm64 rpm:arm64
            unpacked_dir: linux-arm64-unpacked
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      # `runner.arch` is part of the key: both Linux cells report
      # `runner.os == 'Linux'`, and a store populated on x64 carries none of the
      # arm64 prebuilds (and vice versa), so a shared key would thrash the cache
      # between cells on every run.
      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-ok-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ok-pnpm-store-

      - name: Install dependencies
        env:
          # Rebuild native modules against Electron's Node ABI — mirrors
          # desktop-release.yml.
          ELECTRON_SKIP_REBUILD: "0"
        run: pnpm install --frozen-lockfile

      - name: Download workspace bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v5.0.0
        with:
          name: workspace-bundle
          path: packages/

      - name: Prepare cross-arch keyring prebuilds
        working-directory: packages/desktop
        run: node scripts/prepare-platform-natives.mjs

      # Stage @parcel/watcher onto the bundled CLI's module path. This workflow
      # invokes electron-builder directly (not the build:win/build:linux npm
      # scripts, which DO run this), so the step must be explicit here or the
      # packaged app ships without @parcel/watcher on the CLI path and the
      # server degrades to chokidar (#760). Stages only the host-arch binary
      # today; the other-arch artifact uses the (subfolder-correct) chokidar
      # fallback — see scripts/stage-parcel-watcher.mjs.
      - name: Stage @parcel/watcher for the bundled CLI
        working-directory: packages/desktop
        run: node scripts/stage-parcel-watcher.mjs

      - name: Build desktop main/preload/renderer
        working-directory: packages/desktop
        run: pnpm run build:desktop

      # electron-builder downloads its own `fpm`, but fpm shells out to the
      # host's `rpmbuild` to assemble an `.rpm` — and an Ubuntu runner has no
      # rpm tooling preinstalled, so the rpm target dies with "Can't find
      # rpmbuild". Ubuntu's `rpm` package carries /usr/bin/rpmbuild. The deb
      # and AppImage targets need nothing extra, so this is the only apt step
      # in the job.
      - name: Install rpmbuild (fpm's rpm backend)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm

      # Each cell packages only its own arch, on a runner of that arch — so the
      # `.deb` / `.rpm` ship the matching `@parcel/watcher` / `@napi-rs/keyring`
      # prebuilds rather than degrading file-watching to chokidar. The deb and
      # rpm targets need `fpm`; electron-builder 26 downloads a native
      # `linux-arm64v8` build of it (see app-builder-lib's `getFpmPath`), so no
      # emulation or system fpm is involved.
      - name: Package ${{ matrix.targets }}
        working-directory: packages/desktop
        # --config: the Linux overlay turns off the native-rebuild pass WITHOUT
        # asserting that node_modules are staged externally. See
        # electron-builder.linux.yml.
        run: |
          pnpm exec electron-builder --linux ${{ matrix.targets }} --publish never \
            --config electron-builder.linux.yml

      - name: Assert Linux terminal native package compatibility
        working-directory: packages/desktop
        env:
          OK_LINUX_PACKAGE_DIR: dist-desktop/${{ matrix.unpacked_dir }}
        run: pnpm exec vitest run tests/unit/linux-package-native-guards.test.ts

      # Fail before uploading an installer that cannot start (see the Windows
      # step for the full rationale). This is the control that would have caught
      # the 0.42.2 arm64 deb, which installed cleanly and then died on
      # `Cannot find package 'pino'` with no user-visible signal at all.
      - name: Assert the packaged asar carries its dependencies
        working-directory: packages/desktop
        run: node scripts/assert-asar-complete.mjs dist-desktop "linux ${{ matrix.arch }} installers"

      # One artifact per installer, named for its file (see the Windows upload
      # steps for the rationale). Guarded per-arch because artifact names must
      # be unique within a run and each cell produces a different set.
      - name: Upload Linux deb (amd64)
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenKnowledge-amd64-deb
          path: packages/desktop/dist-desktop/*amd64.deb
          retention-days: 14
          if-no-files-found: error

      - name: Upload Linux deb (arm64)
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenKnowledge-arm64-deb
          path: packages/desktop/dist-desktop/*arm64.deb
          retention-days: 14
          if-no-files-found: error

      # rpm artifacts carry the Fedora/RHEL arch words, not the Debian ones —
      # electron-builder rewrites `${arch}` per extension, so the same
      # `${productName}-${arch}.${ext}` pattern yields OpenKnowledge-x86_64.rpm
      # here where it yields OpenKnowledge-amd64.deb above.
      - name: Upload Linux rpm (x86_64)
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenKnowledge-x86_64-rpm
          path: packages/desktop/dist-desktop/*x86_64.rpm
          retention-days: 14
          if-no-files-found: error

      - name: Upload Linux rpm (aarch64)
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenKnowledge-aarch64-rpm
          path: packages/desktop/dist-desktop/*aarch64.rpm
          retention-days: 14
          if-no-files-found: error

      # No Linux update-metadata upload: these are unsigned QA artifacts,
      # never published, so their `latest-linux*.yml` files have no consumer.
      # The release path (desktop-release.yml) uploads the Linux manifests —
      # electron-updater's DebUpdater/RpmUpdater consume them since the
      # auto-updater was un-gated on Linux.
