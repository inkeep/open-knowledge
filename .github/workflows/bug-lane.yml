name: Bug lane

# Automated cherry-pick point releases for bug-linked patch fixes — the
# EVALUATOR half. The cherry-pick, the fast test tiers and the dispatch live in
# bug-lane-verify.yml; this workflow decides whether there is anything to do
# and hands the batch over.
#
# WHY. The fast soak tier qualifies whole cuts, and one minor changeset in the
# pending pile disqualifies every cut until the cycle's stable ships — so in a
# feature-heavy week a perfectly tagged bug fix waits ~24h behind unrelated
# work. This lane qualifies fixes individually: a commit whose changesets are
# all patch AND trace to a Bug-labeled Linear issue is cherry-picked onto the
# current stable through the existing point-release cascade. Owner decision
# 2026-07-31; posture and disarm switch in RELEASES.md.
#
# WHY THIS HALF IS SEPARATE. It must finish in SECONDS. The group below cancels
# a superseded tick, a cancelled run's check is welded to whatever commit was
# HEAD when the cron fired, and GitHub's status rollup scores `cancelled` as
# FAILURE — so a long-running job here paints red X's on unrelated commits of
# the public repo, which runs no code gate that could put one there honestly.
# Measured before the split: 66 of 312 commits carried one. Everything slow is
# now behind a dispatch; see the WHY THE SPLIT note in bug-lane-verify.yml.
#
# SAFETY TOPOLOGY, in order:
#   1. Qualification is the soak tier's own bug-link chain (shared helpers) —
#      a triaged Bug label, never a title string.
#   2. VERIFY (bug-lane-verify.yml): the batch is cherry-picked onto the stable
#      IN THAT RUNNER and the fast test tiers (typecheck + unit) run against
#      the synthetic tree — the tree that actually ships, which no CI has
#      otherwise seen. A ref that conflicts is dropped (Slack-notified) and
#      rides its cycle's stable; the self-contained remainder continues. Only
#      an empty survivor set or a red tier refuses the tick.
#   3. point-release.yml re-guards everything (clean pick, delta-matches-fix,
#      patch-only bump, anchor, provenance) and its cascade smokes the signed
#      DMG before the release publishes or npm moves.
#   4. Re-release is structurally impossible: candidates come from the pending
#      pile (main-reset consumes a released fix's changeset), commits already
#      in the stable are pre-filtered, and an empty pick is refused. Every
#      stable this lane cuts carries novel changesets.
#
# ARMED. The `BUG_LANE_ARMED` switch lives in bug-lane-verify.yml, alongside
# every step that reads it.
#
# This lane can never block anything: nothing waits on it, a refusal only
# means the fix ships with its cycle, and the shared ok-release-cadence group
# on point-release itself serializes real releases against beta cuts and
# promotions.

on:
  schedule:
    # Every 20 minutes, offset to interleave with select-beta-to-promote's
    # 7,17,27,... ticks. The old comment here warned that a tick finding
    # candidates spends ~15 minutes in verify; it no longer does, so this
    # cadence is now comfortably clear of this job's own runtime.
    - cron: "2,22,42 * * * *"
  # Fast path: evaluate when a mirrored commit lands rather than waiting for
  # the next tick.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Dispatching bug-lane-verify.yml and reading in-flight runs.
  actions: write

concurrency:
  # Its own group: an evaluator must never queue behind a real cut. A newer
  # tick supersedes an older one; the evaluation is idempotent. Since the split
  # this job runs for seconds, so supersession is a near-empty window rather
  # than the ~15-minute one that used to paint commits red.
  group: ok-bug-lane
  cancel-in-progress: true

jobs:
  bug-lane:
    name: Evaluate qualifying fixes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout with full history and tags
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Evaluate qualifying fixes
        id: evaluate
        env:
          # Optional, same posture as the soak tier: absent, every fix resolves
          # "not bug-linked" and the lane is inert rather than wrong.
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        # Writes fix_refs (comma-joined), stable and fix_tickets to
        # GITHUB_OUTPUT; per-commit verdicts land as notices. Logic + tests:
        # .github/scripts/bug-lane.{mjs,test.mjs}.
        run: node .github/scripts/bug-lane.mjs

      - name: Skip while a release or an earlier verify is in flight
        id: inflight
        if: steps.evaluate.outputs.fix_refs != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # bug-lane-verify.yml is in this list as the FIRST of the two guards
        # that keep verifies serialized (the second is its own concurrency
        # group). Without it, every tick during a ~15-minute verify would
        # request another one against the same batch, and the group would hold
        # them in a queue that re-derives work already in progress.
        run: |
          set -euo pipefail
          active=0
          for wf in point-release.yml promote-stable.yml bug-lane-verify.yml; do
            n=$(gh run list --workflow="$wf" --json status \
              --jq '[.[] | select(.status=="in_progress" or .status=="queued")] | length')
            active=$((active + n))
          done
          if [[ "$active" -gt 0 ]]; then
            echo "busy=true" >> "$GITHUB_OUTPUT"
            echo "::notice::bug-lane: a release or verify run is already in flight (${active}); retrying next tick."
          else
            echo "busy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Hand the batch to the verify workflow
        if: steps.evaluate.outputs.fix_refs != '' && steps.inflight.outputs.busy == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIX_REFS: ${{ steps.evaluate.outputs.fix_refs }}
          STABLE: ${{ steps.evaluate.outputs.stable }}
          FIX_TICKETS: ${{ steps.evaluate.outputs.fix_tickets }}
        run: |
          set -euo pipefail
          # Through an intermediate variable, NOT a brace default in the
          # expansion: a brace in `${V:-...}` is taken literally, backslash and
          # all, and the verify side feeds this straight to jq --argjson. The
          # refusal page carries the same warning for the same reason.
          TICKETS_JSON="${FIX_TICKETS:-}"
          [[ -z "$TICKETS_JSON" ]] && TICKETS_JSON='{}'
          SELF_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh workflow run bug-lane-verify.yml \
            -f fix_refs="$FIX_REFS" \
            -f stable="$STABLE" \
            -f fix_tickets="$TICKETS_JSON" \
            -f dispatched_by="$SELF_URL"
          echo "::notice::bug-lane: dispatched verify for ${FIX_REFS} over ${STABLE}."
          {
            echo "### Bug lane — batch handed to verify"
            echo "- Refs: \`${FIX_REFS}\`"
            echo "- Stable: \`${STABLE}\`"
            echo "The cherry-pick, the fast tiers and the dispatch decision run in **Bug lane verify**."
          } >> "$GITHUB_STEP_SUMMARY"
