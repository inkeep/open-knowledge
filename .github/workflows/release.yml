name: Release

# Release workflow on inkeep/open-knowledge. Single npm publisher
# for BOTH auto-cadence beta releases AND on-demand stable promotions.
#
# Beta path: event-driven on `push` to open-knowledge/main with a paths
# filter on `.changeset/**`. Copybara mirrors
# `public/open-knowledge/.changeset/*.md`, `pre.json`, and `config.json`
# from agents-private. When agents-private merges a PR with a changeset,
# Copybara batches it into a Project-import commit on open-knowledge/main;
# that import push IS the release trigger. The workflow then runs
# `compute-next-beta.mjs` locally to derive baseVersion
# + release notes from the pending changeset pile (skip-gated by the
# previous beta's embedded consumed-set marker), resolves -beta.N inside
# the ok-release-cadence concurrency slot, and tags `github.sha` —
# guaranteed to be the import that contains the change because checkout
# happens AT the push event. This replaces the prior cross-repo
# repository_dispatch model, which suffered an off-by-one: the dispatch
# from agents-private fired before Copybara's mirror push landed, so
# open-knowledge/main HEAD was still the previous import when checkout resolved
# `github.sha`, tagging the wrong commit (Linear PRD-6701).
#
# Three trigger types:
#
# 1. event_name=push (auto-cadence beta):
#    Fires when Copybara mirrors a commit touching `.changeset/**`.
#    Workflow:
#      - Runs `compute-next-beta.mjs` to read `.changeset/*.md` + `pre.json`,
#        compute the delta,
#        and emit { baseVersion, maxBumpType, releaseNotes }. Empty delta
#        (e.g., Copybara import that only touched non-changeset files
#        matching the paths filter) → skip cleanly.
#      - Resolves -beta.N counter from existing vX.Y.Z-beta.* tags
#        (race-free inside the ok-release-cadence concurrency slot).
#      - Overrides every fixed-group packages/*/package.json#version AND
#        both packages/server/assets/skills/{project,discovery}/SKILL.md
#        metadata.version to X.Y.Z-beta.N (transient jq, never committed).
#      - Tags vX.Y.Z-beta.N at `github.sha` + creates a prerelease GitHub
#        Release with the rendered notes (consumed-set marker embedded
#        for the next cut to read).
#      - Dispatches desktop-release.yml so the signed DMG +
#        `beta-mac.yml` land on the prerelease.
#
# 2. event_name=workflow_dispatch (manual recovery):
#    Same code path as the push trigger. Used after a transient flake
#    to re-fire from the current
#    main HEAD without waiting for a new mirror import.
#
# 3. repository_dispatch type=publish-stable (fired by promote-stable.yml
#    on this same repo, once it has tagged vX.Y.Z + created the
#    non-prerelease GitHub Release):
#      client_payload: { ref: "vX.Y.Z", version: "X.Y.Z" }
#    Workflow:
#      - Checks out the stable tag (= the same SHA as the corresponding
#        beta tag).
#      - Overrides every fixed-group package.json#version to the clean
#        X.Y.Z (the public repo's commit at that SHA carries whatever
#        agents-private mirrored, which is a `0.0.0` placeholder under
#        the zero-commit-bump cadence).
#      - Publishes @inkeep/open-knowledge@X.Y.Z to npm with
#        `--tag latest --provenance`.
#    promote-stable.yml separately fires its own `desktop-release`
#    dispatch so the stable DMG + `latest-mac.yml` land on the stable
#    Release.
#
# Why explicit `repository_dispatch` for the beta path here instead of
# relying on `release: published` to cascade: GitHub deliberately
# suppresses downstream workflow runs from GITHUB_TOKEN-authored
# events. This workflow's `gh release create` runs under GITHUB_TOKEN,
# so a `release: published` event from it would NOT cascade to desktop-release.yml.
# `repository_dispatch` and `workflow_dispatch` are the documented
# exemption that cascade even when fired via GITHUB_TOKEN.
#
# `promote-stable.yml` reaches the same place via a different route:
# it uses an App-minted token (which DOES cascade) but creates the
# release as `--draft`, so `release: published` doesn't fire until
# desktop-release.yml later promotes the draft. Its dispatch comment
# documents that path.
#
# Why ONE workflow handles both beta and stable: npm Trusted Publishing
# only allows ONE trusted publisher per package. Both
# event-driven betas and promote-stable route their npm publishes here.
#
# Concurrency group is shared with promote-stable.yml so beta cuts and
# stable promotions never race on the same public-repo state.

on:
  push:
    branches: [main]
    paths:
      - ".changeset/**"
  workflow_dispatch:
  repository_dispatch:
    types: [publish-stable]

permissions:
  contents: read

concurrency:
  group: ok-release-cadence
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  read-releases:
    name: Read the previous beta Release
    runs-on: ubuntu-latest
    cache-mode: none
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release_list_status: ${{ steps.read.outputs.release_list_status }}
      release_list_stdout: ${{ steps.read.outputs.release_list_stdout }}
      release_list_stderr: ${{ steps.read.outputs.release_list_stderr }}
      release_view_tag: ${{ steps.read.outputs.release_view_tag }}
      release_view_status: ${{ steps.read.outputs.release_view_status }}
      release_view_stdout: ${{ steps.read.outputs.release_view_stdout }}
    steps:
      - name: Read the newest beta Release, drafts included, and its body
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          record() {
            local delimiter
            delimiter="ghadelimiter_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
            printf '%s<<%s\n%s\n%s\n' "$1" "$delimiter" "$2" "$delimiter" >> "$GITHUB_OUTPUT"
          }
          list_stderr_file=$(mktemp)
          if list_stdout=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName,isPrerelease --jq '[.[] | select(.isPrerelease) | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-beta\\.[0-9]+$")) | .tagName] | first // ""' 2>"$list_stderr_file"); then
            list_status=0
          else
            list_status=$?
          fi
          list_stderr=$(cat "$list_stderr_file")
          cat "$list_stderr_file" >&2
          record release_list_status "$list_status"
          record release_list_stdout "$list_stdout"
          record release_list_stderr "$list_stderr"
          if [[ "$list_status" -eq 0 && -n "$list_stdout" ]]; then
            if view_stdout=$(gh release view "$list_stdout" --repo "$GITHUB_REPOSITORY" --json body --jq .body); then
              view_status=0
            else
              view_status=$?
            fi
            record release_view_tag "$list_stdout"
            record release_view_status "$view_status"
            record release_view_stdout "$view_stdout"
          fi
          echo "Previous beta Release: ${list_stdout:-none} (list exit ${list_status}${view_status:+, view exit ${view_status}})"

  build:
    name: Build + pack (${{ github.event.action || github.event_name }})
    needs: read-releases
    runs-on: ubuntu-latest
    cache-mode: none
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      run_beta: ${{ steps.compute-beta.outputs.run_beta }}
      base_version: ${{ steps.compute-beta.outputs.base_version }}
      notes_b64: ${{ steps.compute-beta.outputs.notes_b64 }}
      version: ${{ steps.resolve-beta.outputs.version }}
    steps:
      - name: Link to triggering run
        # Back-link: on the publish-stable path, promote-stable forwards its run
        # URL in client_payload.dispatched_by. Blank on the beta push path.
        env:
          DISPATCHED_BY: ${{ github.event.client_payload.dispatched_by }}
        run: |
          set -euo pipefail
          if [[ -n "${DISPATCHED_BY:-}" ]]; then
            echo "::notice::Triggered by ${DISPATCHED_BY}"
            { echo "### Triggered by"; echo "- ${DISPATCHED_BY}"; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # publish-stable: client_payload.ref carries the stable tag
          #   created by promote-stable.yml (= same SHA as the source
          #   beta tag).
          # push / workflow_dispatch (beta path): no client_payload — fall
          #   through to github.sha, which IS the just-pushed Copybara
          #   import for `push` events (no race; this is the off-by-one
          #   fix from Linear PRD-6701).
          ref: ${{ github.event.client_payload.ref || github.sha }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          cache: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Ensure npm 11 for the cli's package surface check
        run: |
          npm install -g npm@11.21.0
          echo "npm $(npm --version)"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Stage native-config prebuilt binaries
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          SERVES: mac,windows,linux
          REQUIRES: mac,windows,linux
        run: |
          summarize() {
            echo "Staged native-config binaries: $1" >> "$GITHUB_STEP_SUMMARY"
          }
          download_bindings() {
            for attempt in 1 2 3; do
              rm -rf /tmp/nc-bindings
              if gh run download "$1" --name native-config-bindings-all --dir /tmp/nc-bindings; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * ${NC_RETRY_BACKOFF_S:-5})); fi
            done
            return 1
          }
          judge_staging() {
            summarize "$1"
            if [ ! -s "$judge" ]; then
              echo "::error::the native-set judge is missing at $GITHUB_SHA and in the release checkout; refusing this cut"
              exit 1
            fi
            node "$judge" staged --serves "$SERVES" --requires "$REQUIRES" --reason "$1" \
              --recovery "If no prebuild run matches this commit's packages/native-config tree, re-run native-config-prebuild.yml on an ancestor of this commit; if staging failed for another reason, re-run this workflow. Either way resume per RELEASES.md 'Native addon staging'."
            exit $?
          }

          # Which prebuild run may be staged is release policy shared with the
          # other publish path and predicted by point-release-plan.mjs, so the
          # selection lives in one tested script instead of three copies of this
          # shell. It walks the green prebuild runs on `main` newest -> oldest
          # and returns the first whose commit is contained in this release AND
          # whose packages/native-config source matches it — the newest ANCESTOR,
          # not the newest run. Taking the newest run refused every stable tag
          # cut before the most recent native-config change, because that run is
          # then a descendant of the release commit rather than an ancestor.
          #
          # The workflow file comes from the DEFAULT branch, but the checkout is
          # the RELEASE ref — so for any tag cut before this selector landed, the
          # script is simply absent from the workspace. Materialize it from the
          # same commit the workflow itself came from, falling back to the
          # checked-out copy. Pairing the two is what lets a re-fire on a stale
          # tag run CURRENT release machinery rather than whatever was frozen in
          # that tag, which is the only way re-firing a blocked release can ever
          # clear it. fetch-depth:0 in checkout has $GITHUB_SHA. The native-set
          # judge that decides what staging may package comes the same way.
          judge="${RUNNER_TEMP:-/tmp}/assert-native-set.mjs"
          if ! git show "$GITHUB_SHA:.github/scripts/assert-native-set.mjs" > "$judge" 2>/dev/null; then
            cp .github/scripts/assert-native-set.mjs "$judge" 2>/dev/null || true
          fi
          selector="${RUNNER_TEMP:-/tmp}/select-native-config-prebuild.mjs"
          if ! git show "$GITHUB_SHA:.github/scripts/select-native-config-prebuild.mjs" > "$selector" 2>/dev/null; then
            cp .github/scripts/select-native-config-prebuild.mjs "$selector" 2>/dev/null || true
          fi
          if [ ! -s "$selector" ]; then
            judge_staging "native-config prebuild selector is missing at $GITHUB_SHA and in the release checkout"
          fi
          nc_err="${RUNNER_TEMP:-/tmp}/native-config-select.err"
          if ! selection=$(node "$selector" 2>"$nc_err"); then
            reason=$(tr '\n' ' ' < "$nc_err" | sed 's/  *$//')
            judge_staging "${reason:-could not select a native-config prebuild run}"
          fi
          # Assert the WHOLE shape, on ONE line. Testing for a tab anywhere is
          # not enough: a stray line ahead of the real answer still contains a
          # tab, so it passes and leaves that noise in run_id, which only
          # surfaces later as a confusing `gh run download` failure. Anchoring
          # the whole value is what actually rejects it. The message is flattened
          # because ::error:: annotations are single-line — an interpolated
          # multi-line value would truncate the page.
          selection_shape='^[0-9]+'$'\t''[0-9a-f]{7,40}$'
          if [[ ! $selection =~ $selection_shape ]]; then
            flattened=$(printf '%s' "$selection" | tr '\n' ' ')
            judge_staging "native-config prebuild selector returned an unusable answer: $flattened"
          fi
          run_id="${selection%%$'\t'*}"
          head_sha="${selection##*$'\t'}"

          if ! download_bindings "$run_id"; then
            judge_staging "could not download native-config-bindings-all from run $run_id after 3 attempts"
          fi
          find /tmp/nc-bindings -name '*.node' -exec cp -f {} packages/native-config/ \;
          count=$(find packages/native-config -maxdepth 1 -name '*.node' | wc -l | tr -d ' ')
          echo "staged $count native-config prebuilt binaries from run $run_id (commit $head_sha)"
          judge_staging "staged $count native-config binaries from run $run_id (commit $head_sha)"

      # The workspace build produces native-config's host `.node` via `napi
      # build` (turbo dep of the cli build), which needs a Rust toolchain.
      # Pin it explicitly rather than relying on whatever `ubuntu-latest`
      # preinstalls, so an image change can't silently break the whole publish at
      # the unguarded cargo invocation. Mirrors native-config-prebuild.yml.
      - name: Setup Rust toolchain for the native-config build
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Build packages
        run: |
          pnpm exec turbo run build --cache=local:,remote:

      - name: Assert the native-config binary set
        env:
          NATIVE_SET_PLATFORMS: ${{ steps.stage.outputs.platforms }}
        run: |
          set -euo pipefail
          git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/scripts/assert-native-set.mjs" > "$RUNNER_TEMP/assert-native-set.mjs"
          node "$RUNNER_TEMP/assert-native-set.mjs" platforms "$NATIVE_SET_PLATFORMS"

      # --- BETA PATH (push + workflow_dispatch) ---

      # Compute baseVersion + maxBumpType + rendered release notes locally
      # from the changeset pile that Copybara mirrored into the just-pushed
      # commit. compute-next-beta.mjs reads `.changeset/*.md` and `pre.json`;
      # emits `{skip: true, reason}` when no new changesets exist
      # since the last beta (e.g., a Copybara import that touched
      # `.changeset/config.json` but no `.md` files, or main-reset
      # consolidation cycles). The script MUTATES the working tree
      # (pre.json + CHANGELOG.md + package.json + deletes .changeset/*.md);
      # the final `Restore working tree` step cleans up.
      - name: Compute next beta base version + render release notes
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: compute-beta
        env:
          RELEASE_LIST_STATUS: ${{ needs.read-releases.outputs.release_list_status }}
          RELEASE_LIST_STDOUT: ${{ needs.read-releases.outputs.release_list_stdout }}
          RELEASE_LIST_STDERR: ${{ needs.read-releases.outputs.release_list_stderr }}
          RELEASE_VIEW_TAG: ${{ needs.read-releases.outputs.release_view_tag }}
          RELEASE_VIEW_STATUS: ${{ needs.read-releases.outputs.release_view_status }}
          RELEASE_VIEW_STDOUT: ${{ needs.read-releases.outputs.release_view_stdout }}
        run: |
          set -euo pipefail
          OUTPUT=$(node scripts/compute-next-beta.mjs)
          echo "Compute output:"
          echo "$OUTPUT" | jq .
          SKIP=$(echo "$OUTPUT" | jq -r '.skip // false')
          if [ "$SKIP" = "true" ]; then
            REASON=$(echo "$OUTPUT" | jq -r .reason)
            echo "::notice::Skipping beta cut: $REASON"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE=$(echo "$OUTPUT" | jq -r .baseVersion)
          # Defer (don't fail) while the anchor is catching up to a fresh stable.
          # Right after a stable promotion, pre.json's anchor still trails the
          # just-shipped stable until main-reset advances it (a cross-repo PR +
          # Copybara round-trip — minutes). Any mirror push landing in that window
          # computes BASE == the fresh stable. Cutting it would regress `@latest`;
          # hard-failing pages on a transient, self-healing condition. Skip this
          # cut instead — a later push re-cuts automatically once the anchor leads.
          # A base strictly BEHIND the stable is NOT this transient window; that is
          # left to the Guard step below to hard-fail. fetch-depth:0 has all tags.
          LATEST_STABLE_TAG=$(git tag --list 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [[ -n "$LATEST_STABLE_TAG" && "$BASE" == "${LATEST_STABLE_TAG#v}" ]]; then
            echo "::warning::Beta base ${BASE} equals the latest stable ${LATEST_STABLE_TAG#v} — pre.json's anchor has not been advanced by main-reset yet. Deferring this beta cut; it re-cuts automatically once the anchor leads."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BUMP=$(echo "$OUTPUT" | jq -r .maxBumpType)
          COUNT=$(echo "$OUTPUT" | jq -r .pendingCount)
          NOTES_B64=$(echo "$OUTPUT" | jq -r .releaseNotes | base64 | tr -d '\n')
          # `run_beta` is the single signal downstream beta steps gate on.
          # Absent (publish-stable path didn't run this step) or `false`
          # (skip branch above) both evaluate as not-beta downstream.
          {
            echo "skip=false"
            echo "run_beta=true"
            echo "base_version=$BASE"
            echo "max_bump_type=$BUMP"
            echo "pending_count=$COUNT"
            echo "notes_b64=$NOTES_B64"
          } >> "$GITHUB_OUTPUT"
          echo "Computed: base=$BASE bump=$BUMP pending=$COUNT"

      # Anchor-drift backstop: the computed beta base must not be BEHIND the
      # latest published stable. The common post-promotion case (base EQUAL to
      # the fresh stable, anchor not yet advanced by main-reset) is now handled
      # upstream in compute-beta as a deferred skip, so run_beta is only 'true'
      # here when base != stable. A base strictly BEHIND stable is genuine anchor
      # drift — not the transient window — and would cut a `-beta.N` that is
      # semver-BEHIND `@latest`; fail loud with the recovery action. Uses the
      # latest stable tag (no network) — fetch-depth:0 has all tags locally.
      - name: Guard - beta base must lead the latest stable
        if: steps.compute-beta.outputs.run_beta == 'true'
        env:
          BASE_VERSION: ${{ steps.compute-beta.outputs.base_version }}
        run: |
          set -euo pipefail
          LATEST_STABLE_TAG=$(git tag --list 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [[ -z "$LATEST_STABLE_TAG" ]]; then
            echo "No stable tag yet; skipping lead check (bootstrap)."
            exit 0
          fi
          STABLE="${LATEST_STABLE_TAG#v}"
          TOP=$(printf '%s\n%s\n' "$BASE_VERSION" "$STABLE" | sort -V | tail -n1)
          if [[ "$TOP" != "$BASE_VERSION" ]]; then
            echo "::error::Computed beta base ${BASE_VERSION} is BEHIND the latest stable ${STABLE} — genuine anchor drift, not the transient post-promotion window (base==stable is deferred upstream)."
            echo "::error::Run public-open-knowledge-main-reset.yml with stable_version=${STABLE} on agents-private, then re-cut. If that reset fails its version guard, re-dispatch it with -f anchor_override=true (RELEASES.md, Recovering anchor drift)."
            exit 1
          fi
          echo "Beta base ${BASE_VERSION} leads latest stable ${STABLE}."

      # Resolve the -beta.N counter inside this concurrency slot so
      # concurrent push events (e.g., two rapid Copybara imports that each
      # carry a changeset) see different N's and never collide on tag
      # creation. The concurrency group serializes runs against the same
      # public-repo state, so the max-N scan is race-free.
      - name: Resolve -beta.N counter
        if: steps.compute-beta.outputs.run_beta == 'true'
        id: resolve-beta
        env:
          BASE_VERSION: ${{ steps.compute-beta.outputs.base_version }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_VERSION:-}" ]]; then
            echo "::error::compute-beta did not emit base_version"
            exit 1
          fi
          if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::compute-beta base_version '${BASE_VERSION}' is not bare semver (X.Y.Z)"
            exit 1
          fi

          MAX_N=-1
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            if [[ "$tag" =~ ^v${BASE_VERSION//./\\.}-beta\.([0-9]+)$ ]]; then
              n="${BASH_REMATCH[1]}"
              if (( n > MAX_N )); then MAX_N="$n"; fi
            fi
          done < <(git tag --list "v${BASE_VERSION}-beta.*")

          NEXT_N=$((MAX_N + 1))
          VERSION="${BASE_VERSION}-beta.${NEXT_N}"
          TAG="v${VERSION}"
          echo "Existing max -beta.N for base ${BASE_VERSION}: ${MAX_N} -> emitting ${TAG}"

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Override fixed-group versions to X.Y.Z-beta.N
        if: steps.compute-beta.outputs.run_beta == 'true'
        env:
          VERSION: ${{ steps.resolve-beta.outputs.version }}
        run: |
          set -euo pipefail
          # Same primitive as the publish-stable path: jq edits the
          # version field directly, never committed. The change lives
          # only for this workflow run and is discarded with the runner.
          # `npm version` would walk workspace deps and reject pnpm's
          # `workspace:*` protocol with EUNSUPPORTEDPROTOCOL — jq sidesteps.
          for pkg in cli core server app desktop; do
            f="packages/${pkg}/package.json"
            jq --arg v "$VERSION" '.version=$v' "$f" > "${f}.tmp"
            mv "${f}.tmp" "$f"
          done
          # Both skill bundles' metadata.version "tracks
          # @inkeep/open-knowledge-server package version" — the build-time
          # invariant test in packages/server/src/skill-state.test.ts asserts
          # they match. Mutate in place (sed: same transient-only model as jq
          # above), once per bundle.
          for skill in packages/server/assets/skills/project/SKILL.md \
                       packages/server/assets/skills/discovery/SKILL.md; do
            sed -i'.bak' -E "s/^([[:space:]]+version:[[:space:]]+\")[^\"]+(\".*)$/\1${VERSION}\2/" "$skill"
            rm -f "${skill}.bak"
          done
          echo "All fixed-group package.json files + both skill bundles' metadata.version now at ${VERSION} (in-memory only)."

      - name: Validate stable_version + override package.json (publish-stable)
        if: github.event.action == 'publish-stable'
        env:
          STABLE_VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail

          if [[ -z "${STABLE_VERSION:-}" ]]; then
            echo "::error::publish-stable dispatch missing client_payload.version"
            exit 1
          fi
          if [[ ! "$STABLE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::publish-stable client_payload.version '${STABLE_VERSION}' is not bare semver (X.Y.Z)"
            exit 1
          fi

          for pkg in cli core server app desktop; do
            f="packages/${pkg}/package.json"
            jq --arg v "$STABLE_VERSION" '.version=$v' "$f" > "${f}.tmp"
            mv "${f}.tmp" "$f"
          done
          for skill in packages/server/assets/skills/project/SKILL.md \
                       packages/server/assets/skills/discovery/SKILL.md; do
            sed -i'.bak' -E "s/^([[:space:]]+version:[[:space:]]+\")[^\"]+(\".*)$/\1${STABLE_VERSION}\2/" "$skill"
            rm -f "${skill}.bak"
          done
          echo "All fixed-group package.json files + both skill bundles' metadata.version now at ${STABLE_VERSION} (in-memory only)."

      - name: Run the cli's prepublishOnly against the overridden versions
        if: github.event.action == 'publish-stable' || steps.compute-beta.outputs.run_beta == 'true'
        working-directory: packages/cli
        run: pnpm run prepublishOnly

      - name: Pack the cli tarball
        if: github.event.action == 'publish-stable' || steps.compute-beta.outputs.run_beta == 'true'
        working-directory: packages/cli
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-package"
          pnpm pack --pack-destination "$RUNNER_TEMP/npm-package"

      - name: Upload the packed tarball for the publish job
        if: github.event.action == 'publish-stable' || steps.compute-beta.outputs.run_beta == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error
          retention-days: 30

      - name: Restore working tree (defensive)
        if: always()
        run: git restore . || true

  release:
    name: Tag + release (${{ github.event.action || github.event_name }})
    needs: build
    if: github.event.action == 'publish-stable' || needs.build.outputs.run_beta == 'true'
    runs-on: ubuntu-latest
    cache-mode: none
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.resolve-beta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Refuse build outputs that are not well-formed versions
        if: needs.build.outputs.run_beta == 'true'
        env:
          BASE_VERSION: ${{ needs.build.outputs.base_version }}
          BUILD_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The build job's base_version is not bare semver (X.Y.Z). Refusing to use it."
            exit 1
          fi
          if [[ ! "$BUILD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "::error::The build job's version is not X.Y.Z-beta.N. Refusing to use it."
            exit 1
          fi

      - name: Guard - beta base must lead the latest stable
        if: needs.build.outputs.run_beta == 'true'
        env:
          BASE_VERSION: ${{ needs.build.outputs.base_version }}
        run: |
          set -euo pipefail
          LATEST_STABLE_TAG=$(git tag --list 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [[ -z "$LATEST_STABLE_TAG" ]]; then
            echo "No stable tag yet; skipping lead check (bootstrap)."
            exit 0
          fi
          STABLE="${LATEST_STABLE_TAG#v}"
          TOP=$(printf '%s\n%s\n' "$BASE_VERSION" "$STABLE" | sort -V | tail -n1)
          if [[ "$TOP" != "$BASE_VERSION" ]]; then
            echo "::error::Computed beta base ${BASE_VERSION} is BEHIND the latest stable ${STABLE} — genuine anchor drift, not the transient post-promotion window (base==stable is deferred upstream)."
            echo "::error::Run public-open-knowledge-main-reset.yml with stable_version=${STABLE} on agents-private, then re-cut. If that reset fails its version guard, re-dispatch it with -f anchor_override=true (RELEASES.md, Recovering anchor drift)."
            exit 1
          fi
          echo "Beta base ${BASE_VERSION} leads latest stable ${STABLE}."

      - name: Resolve -beta.N counter
        if: needs.build.outputs.run_beta == 'true'
        id: resolve-beta
        env:
          BASE_VERSION: ${{ needs.build.outputs.base_version }}
        run: |
          set -euo pipefail
          MAX_N=-1
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            if [[ "$tag" =~ ^v${BASE_VERSION//./\\.}-beta\.([0-9]+)$ ]]; then
              n="${BASH_REMATCH[1]}"
              if (( n > MAX_N )); then MAX_N="$n"; fi
            fi
          done < <(git tag --list "v${BASE_VERSION}-beta.*")

          NEXT_N=$((MAX_N + 1))
          VERSION="${BASE_VERSION}-beta.${NEXT_N}"
          TAG="v${VERSION}"
          echo "Existing max -beta.N for base ${BASE_VERSION}: ${MAX_N} -> emitting ${TAG}"

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse a beta the build job resolved differently
        if: needs.build.outputs.run_beta == 'true'
        env:
          RESOLVED: ${{ steps.resolve-beta.outputs.version }}
          BUILD_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$RESOLVED" != "$BUILD_VERSION" ]]; then
            echo "::error::The build job packed ${BUILD_VERSION}, but this job resolved ${RESOLVED} from the tags. Refusing to tag and publish a beta the build job did not pack. This usually means only the failed jobs were re-run after a tag landed, which reuses the build job's earlier result. Re-run all jobs."
            exit 1
          fi
          echo "The build job packed the beta this job resolved: ${RESOLVED}"

      - name: Attest production reader before release
        if: github.event.action == 'publish-stable' || needs.build.outputs.run_beta == 'true'
        uses: ./.github/composite-actions/share-contract-reader-gate
        with:
          origin: https://openknowledge.ai
          evidence-name: share-contract-release-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Tag + create prerelease GitHub Release
        if: needs.build.outputs.run_beta == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve-beta.outputs.tag }}
          NOTES_B64: ${{ needs.build.outputs.notes_b64 }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          # shellcheck disable=SC2016
          git -c credential.helper= \
            -c 'credential.helper=!f() { test "$1" = get || return 0; echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' \
            push origin "$TAG"

          BODY_FILE=$(mktemp)
          if [[ -n "${NOTES_B64:-}" ]]; then
            echo "$NOTES_B64" | base64 --decode > "$BODY_FILE"
          else
            printf 'Auto-cadence beta release.\n' > "$BODY_FILE"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; updating notes."
            gh release edit "$TAG" --notes-file "$BODY_FILE"
          else
            # Create as draft so the release is invisible in the .atom feed
            # until desktop-release.yml uploads beta-mac.yml AND promotes
            # draft → published. This closes the publish-window race that
            # surfaced misleading latest-mac.yml 404 errors in user logs
            # during the gap between release creation and DMG upload
            # (typical 5-10 min; up to ~45 min if notary or sign is slow —
            # desktop-release.yml's job timeout-minutes is 45). Channel-
            # mirror invariant: see
            # packages/desktop/src/main/auto-updater.ts:336-356.
            gh release create "$TAG" \
              --draft \
              --prerelease \
              --title "$TAG" \
              --notes-file "$BODY_FILE"
          fi

      - name: Trigger desktop-release.yml to build + upload the desktop installers
        if: needs.build.outputs.run_beta == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve-beta.outputs.tag }}
        run: |
          set -euo pipefail
          payload=$(jq -nc \
            --arg tag "$TAG" \
            --arg ref "$TAG" \
            '{event_type: "desktop-release", client_payload: {release_tag: $tag, ref: $ref}}')
          gh api -X POST "repos/${GITHUB_REPOSITORY}/dispatches" --input - <<<"$payload"
          echo "Dispatched desktop-release for ${TAG}; desktop-release.yml will build every platform installer and upload them + the beta channel manifests to the prerelease."

  publish:
    name: Publish to npm (${{ github.event.action || github.event_name }})
    needs: [build, release]
    if: github.event.action == 'publish-stable' || needs.build.outputs.run_beta == 'true'
    runs-on: ubuntu-latest
    cache-mode: none
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Setup Node for npm OIDC publish
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # UPSTREAM(npm/cli#9722): npm 12.0.0 shipped without the sigstore module libnpmpublish loads for provenance.
      - name: Install npm 11.21.0 for OIDC + provenance
        run: |
          npm install -g npm@11.21.0
          echo "npm $(npm --version)"

      - name: Download the tarball the build job packed
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package

      - name: Publish to npm via Trusted Publishing
        env:
          ACTION: ${{ github.event.action }}
          BETA_VERSION: ${{ needs.release.outputs.version }}
          STABLE_VERSION: ${{ github.event.client_payload.version }}
          PACKAGE_NAME: "@inkeep/open-knowledge"
          PACKAGE_DIR: ${{ runner.temp }}/npm-package
        run: |
          set -euo pipefail

          if [[ "$ACTION" == "publish-stable" ]]; then
            TAG=latest
            VERSION="$STABLE_VERSION"
          else
            TAG=beta
            VERSION="$BETA_VERSION"
          fi

          shopt -s nullglob
          tarballs=("$PACKAGE_DIR"/*.tgz)
          if (( ${#tarballs[@]} != 1 )); then
            echo "::error::The build job's npm-package artifact holds ${#tarballs[@]} tarballs, not one. Refusing to publish."
            exit 1
          fi
          TARBALL="${tarballs[0]}"
          pacote="$(npm root -g)/npm/node_modules/pacote"
          read_status=0
          manifest=$(node -e '
            const fail = (status) => (error) => {
              process.stderr.write(JSON.stringify(String(error && error.message)) + "\n");
              process.exit(status);
            };
            let reading;
            try {
              reading = require(process.argv[1])
                .manifest("file:" + process.argv[2], { fullMetadata: true, fullReadJson: true });
            } catch (error) {
              fail(2)(error);
            }
            reading.then((manifest) => process.stdout.write(JSON.stringify(manifest)), fail(1));
          ' "$pacote" "$TARBALL") || read_status=$?
          if (( read_status == 2 )); then
            echo "::error::npm's pacote did not load from ${pacote}, or threw before opening the tarball; its reason is printed above, JSON-encoded. Refusing to publish."
            exit 1
          fi
          if (( read_status != 0 )); then
            echo "::error::npm cannot read the packed tarball's manifest; its reason is printed above, JSON-encoded. Refusing to publish."
            exit 1
          fi
          if ! jq -e --arg name "$PACKAGE_NAME" --arg version "$VERSION" \
            '.name == $name and .version == $version and ((.publishConfig // {}) | keys - ["access"] | length == 0)' \
            <<<"$manifest" >/dev/null; then
            echo "::error::The packed tarball's manifest, as npm reads it, is $(jq -c '{name, version, publishConfig}' <<<"$manifest"). This job publishes only ${PACKAGE_NAME}@${VERSION}, whose publishConfig may set access and nothing else. Refusing to publish."
            exit 1
          fi

          if [[ "$(npm view "${PACKAGE_NAME}@${VERSION}" version 2>/dev/null || true)" == "$VERSION" ]]; then
            echo "::notice::${PACKAGE_NAME}@${VERSION} is already on npm; nothing to publish."
            exit 0
          fi

          echo "Publishing with --tag ${TAG} (VERSION=${VERSION})"
          npm publish "$TARBALL" --access public --tag "$TAG" --provenance --registry https://registry.npmjs.org/
