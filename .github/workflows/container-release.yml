name: Container release

# Builds and pushes ghcr.io/inkeep/open-knowledge for every npm release
# (beta and stable). release.yml triggers it with a repository_dispatch
# after npm publish, because events created with GITHUB_TOKEN don't
# trigger `release: published`. workflow_dispatch is for rebuilding an
# already published version by hand.
#
# Note: a new GHCR package is private after the first push. Someone has to
# make it public once in https://github.com/orgs/inkeep/packages.

on:
  repository_dispatch:
    types: [container-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Published npm version to containerize, without the leading v (e.g. 0.77.8 or 0.78.0-beta.3)"
        required: true
        type: string
      update_moving_tag:
        description: "Also point latest/beta at this build (turn off to rebuild an old version without moving the floating tag backward)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ok-container-release-${{ github.event.client_payload.version || inputs.version }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build + push container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Resolve version + tag inputs
        id: version
        env:
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          MANUAL_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          UPDATE_MOVING_TAG_INPUT: ${{ inputs.update_moving_tag }}
        run: |
          set -euo pipefail
          VERSION="${DISPATCH_VERSION:-$MANUAL_VERSION}"
          if [[ -z "$VERSION" ]]; then
            echo "::error::no version supplied (client_payload.version or workflow_dispatch inputs.version)"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "::error::version '$VERSION' is not bare semver or semver-beta.N (X.Y.Z or X.Y.Z-beta.N)"
            exit 1
          fi
          if [[ "$VERSION" == *-beta.* ]]; then
            MOVING_TAG=beta
          else
            MOVING_TAG=latest
          fi
          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            UPDATE_MOVING_TAG=true
          else
            UPDATE_MOVING_TAG="${UPDATE_MOVING_TAG_INPUT:-true}"
          fi
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "moving_tag=$MOVING_TAG"
            echo "update_moving_tag=$UPDATE_MOVING_TAG"
            echo "tags<<TAGS_EOF"
            echo "type=raw,value=v$VERSION"
            if [[ "$UPDATE_MOVING_TAG" == "true" ]]; then
              echo "type=raw,value=$MOVING_TAG"
            fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${IMAGE}:v${VERSION} (moving tag :${MOVING_TAG}: ${UPDATE_MOVING_TAG})"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # npm can take a bit to show a freshly published version
      - name: Wait for npm to have this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if npm view "@inkeep/open-knowledge@${VERSION}" version 2>/dev/null | grep -qF "${VERSION}"; then
              echo "npm has @inkeep/open-knowledge@${VERSION}"
              exit 0
            fi
            echo "attempt ${attempt}/10: @inkeep/open-knowledge@${VERSION} not on npm yet, waiting 15s"
            sleep 15
          done
          echo "::error::@inkeep/open-knowledge@${VERSION} never appeared on npm after 10 attempts (150s)"
          exit 1

      - name: Set up QEMU (arm64 emulation for the buildx builder)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ steps.version.outputs.tags }}
          labels: |
            org.opencontainers.image.title=open-knowledge
            org.opencontainers.image.description=Local-first, agent-friendly Markdown knowledge base (server + web UI)
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build + push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            OK_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (cosign keyless)
        env:
          DIGEST_REF: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$DIGEST_REF"

      - name: Summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
          MOVING_TAG: ${{ steps.version.outputs.moving_tag }}
          UPDATE_MOVING_TAG: ${{ steps.version.outputs.update_moving_tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Container image published"
            echo "- \`${IMAGE}:${TAG}\`"
            if [[ "$UPDATE_MOVING_TAG" == "true" ]]; then
              echo "- \`${IMAGE}:${MOVING_TAG}\`"
            fi
            echo "- digest: \`${DIGEST}\`"
            echo ""
            echo "Verify: \`cosign verify --certificate-identity-regexp \"^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/container-release\\.yml@\" --certificate-oidc-issuer https://token.actions.githubusercontent.com ${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
