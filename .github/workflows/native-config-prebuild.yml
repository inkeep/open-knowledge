name: native-config prebuild

# Cross-platform prebuild matrix for the `@inkeep/open-knowledge-native-config`
# napi-rs addon (the toml_edit parse + format-preserving Codex TOML edit engine).
# Builds one `.node` per target so the published CLI can bundle all of them into
# `packages/cli/dist/native/` (Option 3 — bundle into the CLI tarball; see
# reports/native-addon-npm-distribution/REPORT.md). Standalone by design: it is
# NOT grafted into release.yml so the pure-JS beta-cadence publisher stays
# untouched; the release flow downloads these artifacts before the CLI build.
#
# Mirrors the napi-rs package-template CI build matrix (runner mapping +
# --use-napi-cross for linux-gnu cross builds + cargo-zigbuild for musl). Every
# `uses:` is SHA-pinned with a version comment, matching release.yml.

on:
  workflow_dispatch:
  push:
    # branches: [main] is load-bearing, not cosmetic. Without it the `push`
    # event also matches TAG pushes, and a freshly-created tag (every release
    # cuts a vX.Y.Z tag on the mirror) is a new ref with no prior state to
    # diff, so GitHub cannot evaluate the `paths` filter and runs the workflow
    # unconditionally — the full 8-target matrix re-ran on every release
    # regardless of whether native-config changed. A branch filter excludes
    # tag refs (tags never match `branches`), keeping this scoped to actual
    # native-config source changes on main.
    branches: [main]
    paths:
      - "packages/native-config/**"
      - ".github/workflows/native-config-prebuild.yml"
  pull_request:
    paths:
      - "packages/native-config/**"
      - ".github/workflows/native-config-prebuild.yml"

# Per-ref isolation — a new push to the same branch cancels the in-flight run.
# Deliberately NOT the `ok-release-cadence` group (that serializes beta/stable
# cuts); this prebuild is independent of the release pipeline.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    cache-mode: none
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        settings:
          # macos-26 is Apple-Silicon (arm64); it cross-builds the x64 darwin
          # target with the same SDK, so both darwin targets share the host.
          - host: macos-26
            target: aarch64-apple-darwin
            napiFlags: ""
          - host: macos-26
            target: x86_64-apple-darwin
            napiFlags: ""
          # --use-napi-cross pulls the zig-backed cross toolchain napi-rs ships
          # for glibc Linux targets, so an x64 ubuntu host builds both arches.
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            napiFlags: "--use-napi-cross"
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            napiFlags: "--use-napi-cross"
          # -x routes the build through cargo-zigbuild for musl (Alpine) targets.
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            napiFlags: "-x"
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            napiFlags: "-x"
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            napiFlags: ""
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            napiFlags: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          install: false
          cache: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}

      - name: Install Zig 0.14.1 from a mirror, checked against its sha256 (musl targets only)
        if: contains(matrix.settings.target, 'musl')
        shell: bash
        env:
          ZIG_TARBALL: zig-x86_64-linux-0.14.1.tar.xz
          ZIG_SHA256: 24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != x86_64 ]; then
            echo "::error::$ZIG_TARBALL is the x86_64 Linux build, but this runner is $(uname -m)"
            exit 1
          fi
          tarball="$RUNNER_TEMP/$ZIG_TARBALL"
          mirrors=$(curl -fsSL --retry 3 --max-time 30 https://ziglang.org/download/community-mirrors.txt | shuf || true)
          mismatched=""
          for base in $mirrors https://ziglang.org/download/0.14.1; do
            if ! curl -fsSL --connect-timeout 10 --speed-limit 1000000 --speed-time 15 --max-time 120 \
              -o "$tarball" "$base/$ZIG_TARBALL?source=open-knowledge-native-config-prebuild"; then
              echo "$base did not finish serving $ZIG_TARBALL"
              continue
            fi
            actual=$(sha256sum "$tarball" | cut -d ' ' -f 1)
            if [ "$actual" != "$ZIG_SHA256" ]; then
              echo "::warning::$base served $ZIG_TARBALL with sha256 $actual, not the expected $ZIG_SHA256"
              mismatched="$mismatched $base"
              continue
            fi
            tar -xJf "$tarball" -C "$RUNNER_TEMP"
            "$RUNNER_TEMP/${ZIG_TARBALL%.tar.xz}/zig" version
            echo "$RUNNER_TEMP/${ZIG_TARBALL%.tar.xz}" >> "$GITHUB_PATH"
            echo "Installed $ZIG_TARBALL from $base"
            exit 0
          done
          if [ -n "$mismatched" ]; then
            echo "::error::no source served $ZIG_TARBALL with sha256 $ZIG_SHA256, and these served it with a different sha256:$mismatched"
          else
            echo "::error::no source served $ZIG_TARBALL with sha256 $ZIG_SHA256; every download failed before its sha256 could be checked"
          fi
          exit 1

      - name: Install cargo-zigbuild (musl targets only)
        if: contains(matrix.settings.target, 'musl')
        uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2.82.5
        with:
          tool: cargo-zigbuild

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build addon
        working-directory: packages/native-config
        shell: bash
        # Invoke napi directly instead of `pnpm run build -- <flags>`: pnpm
        # forwards the `--` separator literally, so the per-target flags landed
        # after it (`napi build --platform --release -- --target … --use-napi-cross`)
        # and napi passes everything past `--` straight through to `cargo build`,
        # which rejects `--use-napi-cross` ("unexpected argument"). --target,
        # --use-napi-cross and -x are all `napi build` flags and must sit before
        # any separator. Keep --platform --release in sync with the package's own
        # `build` script.
        run: pnpm exec napi build --platform --release --target ${{ matrix.settings.target }} ${{ matrix.settings.napiFlags }}

      - name: Test the crate on the one Windows target this x64 host can execute
        if: matrix.settings.target == 'x86_64-pc-windows-msvc'
        working-directory: packages/native-config
        shell: bash
        run: cargo test

      - name: Upload binding
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-${{ matrix.settings.target }}
          path: packages/native-config/*.node
          if-no-files-found: error

  combine:
    name: combine + verify all targets present
    needs: build
    runs-on: ubuntu-latest
    cache-mode: none
    timeout-minutes: 10
    steps:
      - name: Download all bindings
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: artifacts

      - name: Assert every target produced exactly one binding
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            aarch64-apple-darwin
            x86_64-apple-darwin
            x86_64-unknown-linux-gnu
            aarch64-unknown-linux-gnu
            x86_64-unknown-linux-musl
            aarch64-unknown-linux-musl
            x86_64-pc-windows-msvc
            aarch64-pc-windows-msvc
          )
          missing=0
          for t in "${targets[@]}"; do
            dir="artifacts/bindings-$t"
            count=$(find "$dir" -name '*.node' 2>/dev/null | wc -l | tr -d ' ')
            if [ "$count" -lt 1 ]; then
              echo "::error::no .node found for target $t (artifact bindings-$t)"
              missing=1
            else
              echo "ok: $t -> $(find "$dir" -name '*.node')"
            fi
          done
          total=$(find artifacts -name '*.node' | wc -l | tr -d ' ')
          echo "total .node files: $total"
          if [ "$total" -ne 8 ]; then
            echo "::error::expected 8 .node binaries (one per target), found $total"
            missing=1
          fi
          [ "$missing" -eq 0 ]

      - name: Upload combined bindings bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-config-bindings-all
          path: artifacts/**/*.node
          if-no-files-found: error
