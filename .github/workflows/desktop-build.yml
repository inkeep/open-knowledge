name: Desktop build

# M2 per specs/2026-04-11-electron-desktop-app/SPEC.md §14:
# Produces a Universal DMG (arm64 + x64 merged). When Apple Developer cert
# + notary credentials are configured as repo secrets, the DMG is signed with
# Developer ID, notarized via xcrun notarytool, stapled, and fuse-verified
# (D17 paranoid post-sign check). When secrets are absent, the workflow runs
# `build:mac:unsigned` explicitly and uploads the artifact under a name that
# encodes the unsigned state — consumers can filter by prefix to avoid
# shipping an unsigned build as if it were a release.
#
# Trigger: `workflow_dispatch` only for this iteration. We will add a
# `pull_request` trigger scoped to `packages/desktop/**` changes once the
# signed path has been green at least once in CI. macOS runner minutes are
# ~10× more expensive than ubuntu — PR-triggering only makes sense after
# M2 is closing the DOD loop.
#
# Required secrets (when ready to sign — wire via Settings → Secrets):
#   CSC_LINK                    Base64-encoded .p12 containing the Developer
#                               ID Application cert + private key. Generate:
#                                 base64 -i developer-id.p12 | pbcopy
#                               CSC_LINK is the signal used here to decide
#                               signed-vs-unsigned — without it, the workflow
#                               runs `build:mac:unsigned` and names the
#                               artifact accordingly.
#   CSC_KEY_PASSWORD            Password used to export the .p12.
#   APPLE_ID                    Apple ID email that owns the Developer
#                               Program membership.
#   APPLE_APP_SPECIFIC_PASSWORD App-specific password from appleid.apple.com
#                               (NOT the Apple ID login password). 16 chars,
#                               xxxx-xxxx-xxxx-xxxx format.
#   APPLE_TEAM_ID               10-char Team ID from developer.apple.com/account
#                               (e.g. "ABCDE12345"). Must stay stable forever
#                               per R16 — it anchors the Keychain ACL.
#
# App Store Connect API key alternative (simpler for org-level rotation):
# replace APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID with
# APPLE_API_KEY (path to .p8) + APPLE_API_KEY_ID [+ APPLE_API_ISSUER]. The
# issuer is required only for Team keys — Individual keys rejected it with
# 401 Unauthorized per @electron/notarize's NotaryToolApiKeyCredentials
# type (lib/types.d.ts). The afterSign script auto-detects which credential
# shape is present and fails loud if any shape is partial rather than
# silently skipping. APPLE_* credentials are gated on `CSC_LINK` being
# set (signed mode) — in unsigned mode they are explicitly not passed to
# electron-builder so an operator who sets APPLE_* but forgets CSC_LINK
# cannot accidentally attempt to notarize an ad-hoc-signed .app.

on:
  workflow_dispatch: {}

permissions:
  contents: read

# NOTE: cancel-in-progress is `false` because a mid-notarize cancel is costly.
# Apple notary submissions take 1-5 minutes of wall-clock and don't resume
# cleanly — cancellation leaves a half-stapled bundle and the next attempt
# starts from scratch. workflow_dispatch is manual so accidental re-dispatch
# is rare, and re-runs are cheap compared to the wasted notary round-trip.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  build-macos-dmg:
    # macos-26 is Apple Silicon (Tahoe) with Xcode 26.x preinstalled. Apple
    # Silicon is required for Universal DMG lipo merging (arm64 + x64 →
    # universal) per D29 — a universal DMG built on an Intel-only runner has
    # historically produced broken arm64 slices (electron-builder #6891).
    # Xcode 26+ is required because electron-builder compiles
    # `build/okglass.icon` into `Assets.car` via Apple's `actool`, which only
    # ships with Xcode 26+.
    runs-on: macos-26
    # 45 min budget. Local `pnpm run build:mac:unsigned` baseline on M3 Max
    # is ~3-4 min wall-clock; CI runners are ~2× slower; signing +
    # notarization adds 2-5 min of Apple round-trip on top. 45 min leaves
    # headroom for cold cache and notary-service queue spikes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 24 matches the existing ci.yml / release.yml pattern —
      # turbo's `^build` pulls in the app via workspace deps that resolve
      # to `.ts` sources; Node 22.6+ strips TypeScript types natively.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-ok-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-ok-pnpm-store-

      # Turbo cache keeps `build` fast across runs. Keying on pnpm-lock.yaml
      # warm-caches across commits that don't change dependencies — cold
      # cache only when the lockfile actually moves. `github.sha` in the
      # restore-keys fallback still picks up same-commit re-runs.
      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-desktop-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-desktop-

      - name: Install dependencies
        # ELECTRON_SKIP_REBUILD=0 overrides the default CI skip in
        # packages/desktop/scripts/postinstall.mjs — we *need* the native
        # modules rebuilt against Electron's Node ABI for a packaged build.
        env:
          ELECTRON_SKIP_REBUILD: "0"
        run: pnpm install --frozen-lockfile

      # electron-builder.yml's `extraResources` rule copies from
      # `packages/cli/dist/public/`, which the CLI's `build:assets` populates
      # via `cp -r ../app/dist dist/public`. The CLI does not declare the
      # app as a workspace dep (app is private, and the CLI ships the
      # compiled bundle — not a package reference), so turbo's `^build`
      # runs them in parallel by default. Without explicit sequencing, cli's
      # `build:assets` races app's vite build and can fail (no `app/dist`
      # yet) or copy stale content. Use turbo's `--filter=@inkeep/...`
      # which DOES respect the `^build` graph (so server + core build
      # before app), and run the two filters in sequence to enforce
      # app → cli ordering.
      #
      # A bare per-package `--filter` run was the previous approach; it does
      # not honor turbo's dep graph (only runs the named package's `build`
      # script in isolation). After the workspace started shipping
      # `.mjs` builds for `@inkeep/open-knowledge-server` and
      # `@inkeep/open-knowledge-core` (specs/2026-04-24-desktop-packaging-
      # first-boot/), Vite's config loader in app-build resolves those
      # workspace deps via `exports.default → ./dist/index.mjs`. Without
      # an upstream `^build`, the `dist/` doesn't exist yet → "Failed to
      # resolve entry for package @inkeep/open-knowledge-server".
      - name: Build workspace (produces packages/cli/dist/public for extraResources)
        run: |
          pnpm exec turbo run build --filter=@inkeep/open-knowledge-app
          pnpm exec turbo run build --filter=@inkeep/open-knowledge

      # Decide signed-vs-unsigned path BEFORE invoking electron-builder so
      # the artifact can be named to match. We key off CSC_LINK alone: it's
      # the Developer ID cert, so its absence means we cannot produce a
      # signed build regardless of what notarization creds exist. Missing
      # notarization creds with CSC_LINK present would be caught by
      # afterSign.mjs's partial-credential guard.
      - name: Detect signing mode
        id: signmode
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          if [[ -n "${CSC_LINK}" ]]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing creds present — building signed + notarized + stapled + fuse-verified DMG."
          else
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "::notice::CSC_LINK absent — building unsigned DMG. Artifact will be labeled 'unsigned'."
          fi

      # Twin of the step in desktop-release.yml; keep them in lockstep. Stage
      # the Developer ID cert in a keychain this job owns and hand it to
      # electron-builder via CSC_KEYCHAIN instead of letting it build one from
      # CSC_LINK: electron-builder <= 26.16.0 authenticates
      # `security set-key-partition-list` with the .p12 password rather than
      # the keychain's own (electron-userland/electron-builder#10066), which
      # macOS 26.6 (macos-26 image 20260831 onward) rejects with
      # `SecKeychainUnlock: The user name or passphrase you entered is not
      # correct`. The v26 backport (#10172) is merged but unreleased.
      - name: Prepare signing keychain (CSC_KEYCHAIN)
        if: steps.signmode.outputs.mode == 'signed'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        working-directory: packages/desktop
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN_PATH="$RUNNER_TEMP/ok-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(head -c 32 /dev/urandom | base64)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          CERT_PATH="$RUNNER_TEMP/ok-signing.p12"
          trap 'rm -f "$CERT_PATH"' EXIT

          # CSC_LINK is bare base64 of the .p12 (workflow header). macOS
          # `base64 -i` wraps lines, hence the whitespace strip.
          printf '%s' "$CSC_LINK" | tr -d '[:space:]' | base64 -d > "$CERT_PATH"
          if [[ ! -s "$CERT_PATH" ]]; then
            echo "::error::CSC_LINK did not materialize a .p12 (empty after decode). Re-export with 'base64 -i developer-id.p12 | pbcopy' and paste the single-line output."
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # No lock timeout: sign + notarize runs well past the 5 min default.
          security set-keychain-settings "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild >/dev/null
          # The call electron-builder gets wrong: -k is the KEYCHAIN password.
          # Without this, codesign blocks on a GUI prompt for the private key.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          # Search list: this keychain first, then electron-builder's bundled
          # Apple root + intermediate certs (it adds these itself on the
          # CSC_LINK path so the Developer ID chain validates offline), then
          # whatever was already listed. `list-keychains -s` REPLACES the list.
          ROOT_CERTS="$(node -e '
            const path = require("path");
            const eb = path.dirname(require.resolve("electron-builder/package.json"));
            const lib = path.dirname(require.resolve("app-builder-lib/package.json", { paths: [eb] }));
            process.stdout.write(path.join(lib, "certs", "root_certs.keychain"));
          ')"
          if [[ ! -f "$ROOT_CERTS" ]]; then
            echo "::error::app-builder-lib's bundled root_certs.keychain is not at $ROOT_CERTS; its certs layout may have moved in a dependency bump."
            exit 1
          fi
          if ! LISTED="$(security list-keychains -d user)"; then
            echo "::error::security list-keychains failed; refusing to replace the user search list blind."
            exit 1
          fi
          EXISTING=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%\"}"
            line="${line#\"}"
            [[ -n "$line" ]] && EXISTING+=("$line")
          done <<<"$LISTED"
          # `${arr[@]+...}`: the runner's bash 3.2 treats an empty array as
          # unbound under set -u.
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$ROOT_CERTS" ${EXISTING[@]+"${EXISTING[@]}"}

          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          echo "$IDENTITIES"
          if ! grep -q '"Developer ID Application' <<<"$IDENTITIES"; then
            echo "::error::No valid 'Developer ID Application' identity in the staged keychain. Either the CSC_LINK .p12 / CSC_KEY_PASSWORD pair is wrong, or the cert chain does not validate on this runner. The full identity list is above."
            exit 1
          fi
          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # Materialize App Store Connect API key (Option B notarization shape).
      # @electron/notarize's NotaryToolApiKeyCredentials types `appleApiKey` as
      # a filesystem path to the .p8 file — not the PEM contents. CI runners
      # have no .p8 on disk; the secret holds the key material. Decode here
      # and rewrite APPLE_API_KEY to point at the materialized file.
      #
      # Accepts either format the operator stored:
      #   - Raw PEM (.p8 contents starting with `-----BEGIN PRIVATE KEY-----`)
      #   - Base64 of the .p8 (single-line, survives copy/paste cleanly —
      #     recommended; generate with `base64 -i AuthKey_XXXX.p8 | pbcopy`)
      #
      # No-op when APPLE_API_KEY is unset (Option A password creds path runs
      # instead). Gated on signed mode so unsigned smoke runs don't waste a
      # step writing creds that won't be used.
      - name: Materialize App Store Connect API key
        if: steps.signmode.outputs.mode == 'signed'
        env:
          APPLE_API_KEY_VALUE: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [[ -z "$APPLE_API_KEY_VALUE" ]]; then
            echo "::notice::APPLE_API_KEY secret not set — Option A (APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID) path will run if those creds are present. afterSign.mjs fails loud on partial creds."
            exit 0
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          if [[ "$APPLE_API_KEY_VALUE" == *"BEGIN PRIVATE KEY"* ]] || [[ "$APPLE_API_KEY_VALUE" == *"BEGIN EC PRIVATE KEY"* ]]; then
            printf '%s' "$APPLE_API_KEY_VALUE" > "$KEY_PATH"
          else
            if ! printf '%s' "$APPLE_API_KEY_VALUE" | base64 -d > "$KEY_PATH" 2>/dev/null; then
              echo "::error::APPLE_API_KEY is neither a PEM nor valid base64. Re-export from App Store Connect → Users and Access → Integrations → Team Keys, then either paste the .p8 contents directly OR run 'base64 -i AuthKey_XXXX.p8 | pbcopy' and paste."
              exit 1
            fi
          fi
          if ! head -c 5 "$KEY_PATH" | grep -q "^-----"; then
            echo "::error::Materialized .p8 does not begin with '-----'. Secret was likely double-encoded or corrupted in transit."
            exit 1
          fi
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          echo "::notice::APPLE_API_KEY materialized to $KEY_PATH"

      # Step A: vite/main/preload bundles via electron-vite. Always identical
      # for signed and unsigned modes.
      - name: Build electron-vite bundles
        working-directory: packages/desktop
        run: pnpm run build:desktop

      # Force-install both darwin-arm64 and darwin-x64 prebuilt binaries for
      # @napi-rs/keyring before electron-builder's universal merge runs. pnpm
      # under workspace conditions only installs the host-arch optionalDependency
      # (cpu constraint), so the darwin-x64 binary is missing on an arm64
      # runner. @electron/universal's lipo merge then either errors or hangs
      # waiting for x64 inputs that don't exist.
      #
      # NOTE: electron-builder.yml is currently arm64-only (`target.arch:
      # [arm64]`), so this step is effectively a no-op for the smoke build.
      # Kept in place because (a) it's idempotent and adds <1s, (b) it
      # unblocks a future flip to universal target without another mirror
      # cycle. Documented for the next reader who'd otherwise wonder why.
      - name: Force-install darwin keyring prebuilds for universal merge
        working-directory: packages/desktop
        run: node scripts/prepare-universal.mjs

      # Stage @parcel/watcher onto the bundled CLI's module path. This workflow
      # invokes electron-builder directly (not the build:mac npm script, which
      # DOES run this), so the step must be explicit here or the smoke/QA DMG
      # ships without @parcel/watcher on the CLI path and the server degrades to
      # chokidar (#760).
      - name: Stage @parcel/watcher for the bundled CLI
        working-directory: packages/desktop
        run: node scripts/stage-parcel-watcher.mjs

      # Step B: package via electron-builder. Kept as a separate runner step
      # from step A (rather than chained via && in a single shell). The split
      # was originally forced by a packaging bug in the previous script runner:
      # chaining the build and electron-builder in one shell produced an asar
      # containing a stale workspace-dep `package.json` (the pre-`exports.development`
      # / pre-`files: ["dist", "src"]` snapshot) and omitted `dist/`, while the
      # same commands as separate workflow steps produced a correct asar with the
      # current `package.json` + the built `dist/`. That runner is gone, but the
      # separate-steps structure is preserved defensively — it is free and the
      # failure mode was expensive to diagnose. Specs/2026-04-24-desktop-packaging-
      # first-boot/ §10 OQ4 captured the original open question.
      - name: Package DMG (${{ steps.signmode.outputs.mode }})
        # In signed mode electron-builder signs with the identity in
        # CSC_KEYCHAIN ($GITHUB_ENV, from "Prepare signing keychain"). CSC_LINK
        # / CSC_KEY_PASSWORD must NOT be set here: their presence routes
        # electron-builder back into its own keychain setup, the path that
        # fails on macOS 26.6.
        env:
          APPLE_ID: ${{ steps.signmode.outputs.mode == 'signed' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ steps.signmode.outputs.mode == 'signed' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ steps.signmode.outputs.mode == 'signed' && secrets.APPLE_TEAM_ID || '' }}
          # APPLE_API_KEY itself is NOT set here — the materialize step above
          # writes the .p8 to disk and pushes APPLE_API_KEY=<path> into
          # $GITHUB_ENV so it flows through to this step. Setting it again
          # at step-level would override that path with the raw secret value
          # and break @electron/notarize's path-based contract.
          APPLE_API_KEY_ID: ${{ steps.signmode.outputs.mode == 'signed' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ steps.signmode.outputs.mode == 'signed' && secrets.APPLE_API_ISSUER || '' }}
          # In unsigned mode, force electron-builder to skip its keychain
          # auto-discovery (mirrors `-c.mac.identity=null` in the script).
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signmode.outputs.mode == 'unsigned' && 'false' || '' }}
        working-directory: packages/desktop
        run: |
          if [[ "${{ steps.signmode.outputs.mode }}" == "unsigned" ]]; then
            pnpm exec electron-builder --mac --publish never -c.mac.identity=null
          else
            pnpm exec electron-builder --mac --publish never
          fi

      # Twin of desktop-release.yml's "Attest the signed macOS app": with
      # CSC_KEYCHAIN, a missing identity is a warning and an ad-hoc-signed app
      # rather than electron-builder's own hard failure, so signed mode proves
      # the artifact it uploads is Developer ID signed, hardened-runtime, and
      # stapled before anyone pulls it for a manual smoke.
      - name: Attest the signed macOS app
        if: steps.signmode.outputs.mode == 'signed'
        working-directory: packages/desktop
        run: |
          set -euo pipefail
          FOUND=0
          while IFS= read -r APP; do
            [[ -n "$APP" ]] || continue
            FOUND=$((FOUND + 1))
            echo "::group::codesign $APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
            codesign -dv --verbose=4 "$APP" 2>&1 | tee "$RUNNER_TEMP/codesign-details.txt"
            echo "::endgroup::"
            if ! grep -q 'Authority=Developer ID Application' "$RUNNER_TEMP/codesign-details.txt"; then
              echo "::error::$APP is not Developer ID signed (ad-hoc or unsigned). auto-update would reject this build."
              exit 1
            fi
            if ! grep -qE 'flags=.*\(.*runtime' "$RUNNER_TEMP/codesign-details.txt"; then
              echo "::error::$APP lacks the hardened-runtime flag; notarization requires it."
              exit 1
            fi
            xcrun stapler validate "$APP"
          done < <(find dist-desktop -maxdepth 2 -type d -name '*.app')
          if [[ "$FOUND" -eq 0 ]]; then
            echo "::error::No .app found under dist-desktop to attest."
            exit 1
          fi
          echo "Attested $FOUND signed, notarized, stapled app bundle(s)."

      # Gate on success() — on build failure, there is no DMG, so running
      # the upload step would stack a second "no files found" error on top
      # of the real build error and dilute CI signal. The GHA run log
      # already captures failure diagnostics and is retained 90 days.
      - name: Upload DMG artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Encode signed-vs-unsigned in the artifact name so downstream
          # consumers (release automation in M7, humans pulling for smoke
          # on another Mac) can filter by prefix without inspecting the
          # DMG signature. Unsigned DMGs can run locally after `xattr -cr`
          # but must never be shipped as if they were a release build.
          name: open-knowledge-macos-${{ steps.signmode.outputs.mode }}-${{ github.sha }}
          path: |
            packages/desktop/dist-desktop/*.dmg
            packages/desktop/dist-desktop/*.dmg.blockmap
            packages/desktop/dist-desktop/latest-mac.yml
          retention-days: 14
          if-no-files-found: error

      # Hosted runners are ephemeral, so this is hygiene rather than a
      # security boundary. Runs after the upload so a late failure still
      # leaves diagnostics.
      - name: Remove signing keychain
        if: always()
        run: |
          if [[ -n "${CSC_KEYCHAIN:-}" ]]; then
            security delete-keychain "$CSC_KEYCHAIN" || true
          fi
