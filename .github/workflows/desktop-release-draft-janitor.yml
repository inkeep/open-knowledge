name: Draft release janitor

# Sweeps orphaned draft GitHub Releases off inkeep/open-knowledge.
#
# release.yml creates every beta as `--draft --prerelease`; promote-stable.yml
# does the same for stable. desktop-release.yml flips `draft=false` ONLY after
# the signed DMG + channel manifest (beta-mac.yml / latest-mac.yml) upload
# succeeds — the draft gate keeps a manifest-less release out of the auto-update
# .atom feed. When that build fails (both historical cases were transient:
# an Electron-runtime-download EOF and a GitHub-upload 403, neither retried
# at the time), the release is stranded as a draft. It never entered the feed,
# so auto-update never saw it, but it stays pinned to the top of the web
# releases page forever while the next cut rolls forward past it.
#
# This janitor removes such orphans on a schedule. It is deliberately
# conservative: it deletes a stuck draft beta ONLY once a published STABLE
# release covers that beta's X.Y.Z cycle. That gate is load-bearing — a beta's
# changelog delta lives ONLY in its GitHub Release body, and promote-stable.yml
# aggregates the whole cycle's beta bodies (by tag, via `gh release view`) into
# the stable release notes at promotion time (packages/*/CHANGELOG.md no longer
# accumulates per-beta under the zero-commit-bump cadence). Deleting a beta
# before its cycle is promoted would drop that increment from the stable
# changelog (it renders as "release body unavailable"). Once the cycle's stable
# exists, every in-range beta body has already been aggregated (and a later beta
# on an already-promoted base is never aggregated by any future stable), so the
# body is safe to reap. Drafts on a not-yet-promoted cycle are left for a human
# to re-run desktop-release.yml against or promote. The git TAG is always kept
# (npm-provenance source ref + version lineage); only the Release object goes.
#
# The sweep covers stable drafts on the same gate. A stable draft strands the
# same way (v0.65.0 and v0.66.0 sat draft with zero assets from 2026-08-27 to
# 2026-09-01, swept by hand) but its body feeds no later changelog, so the
# `cycle <= maxstable` gate is if anything more conservative for it than for a
# beta. The selection lives in .github/scripts/select-stuck-drafts.mjs, which is
# unit-tested; this workflow only acts on what that returns.
#
# The age gate reads the release OBJECT's timestamp, never `createdAt`: on a
# GitHub Release `createdAt` is the TARGET COMMIT's date, so a draft created
# from an older commit reads as already-aged the moment it exists and the gate
# that is meant to spare an in-flight build would never fire. `publishedAt` is
# no use either: it is null until the release leaves draft, which is every
# release this job looks at. That leaves `updated_at`, which `gh release list`
# cannot return, so the list comes from the REST endpoint instead.
#
# The gate must exceed desktop-release.yml's SEQUENTIAL CRITICAL PATH, not any
# single job's timeout. build-macos deliberately does NOT need prepare (it is
# self-contained, per its own comment), so those overlap and only the longer leg
# counts: build-macos (75) -> publish-assets (20) -> finalize (15) = 110 minutes
# worst case. publish-assets needs every build and finalize needs publish-assets;
# build-windows and build-linux each finish at 30+45=75, inside the mac leg.
# STUCK_DRAFT_MAX_AGE_SECONDS is 10800 (180 min), clearing 110 with margin for
# cold caches and build-macos's one retry. An earlier 5400 was derived from
# build-macos's 75-minute timeout alone and did not cover the path.
#
# The list is narrowed to drafts plus PUBLISHED STABLES, which is exactly what
# the selector reads (drafts are the candidates, published stables set the
# ceiling). The narrowing is gh's LOCAL --jq transform of the full paginated
# response: the releases endpoint has no filter parameter, so every release
# still crosses the wire; what is bounded is the payload handed to the module.
# That matters because Published betas are dead weight and this repo has
# hundreds: unnarrowed, the payload measured 90,670 bytes across 915 releases,
# and it crosses execve's per-string MAX_ARG_STRLEN (131,072 on Linux, applying
# to env as well as argv) at roughly 1,300 releases. Narrowed, the same snapshot
# is 16,460 bytes across 175 entries and yields an identical sweep set.
#
# Age is a backstop, not the real protection: an in-flight cycle is kept by the
# cycle gate whatever its age, and age is load-bearing only where a draft's
# cycle EQUALS the just-published stable. It cannot cover an operator re-running
# a days-old stranded build at all; the sweep cap and dry_run are the rails for
# that case.

on:
  schedule:
    # Every 6 hours, off the hour to avoid the top-of-hour scheduler surge.
    - cron: "37 */6 * * *"
  # Manual sweep, e.g. right after a known stuck-draft incident.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the sweep set without deleting anything."
        type: boolean
        default: false

permissions:
  # contents: write is required to delete Release objects via the API.
  contents: write

concurrency:
  group: desktop-release-draft-janitor
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAX_SWEEP_PER_RUN: "5"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Delete superseded stuck draft releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          RELEASES_JSON=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq '.[] | select(.draft or (.prerelease | not)) | {tagName: .tag_name, isDraft: .draft, isPrerelease: .prerelease, updatedAt: .updated_at}' \
            | jq -sc '.')
          export RELEASES_JSON

          sweep=$(node .github/scripts/select-stuck-drafts.mjs)

          if [ -z "${sweep}" ]; then
            echo "Nothing to sweep."
            exit 0
          fi

          count=$(printf '%s\n' "${sweep}" | grep -c . || true)

          # The dry run is checked BEFORE the cap so it can always preview,
          # including an over-cap set; it deletes nothing, so the cap is
          # information for it rather than a gate on it.
          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "Dry run: would sweep ${count} release(s), deleting nothing."
            if [ "${count}" -gt "${MAX_SWEEP_PER_RUN}" ]; then
              echo "Dry run: this set exceeds the per-run cap (${count} > ${MAX_SWEEP_PER_RUN}), so a real run would refuse it."
            fi
            printf '%s\n' "${sweep}"
            exit 0
          fi

          if [ "${count}" -gt "${MAX_SWEEP_PER_RUN}" ]; then
            echo "::error::Refusing to sweep ${count} releases in one run (cap ${MAX_SWEEP_PER_RUN}). A healthy repo strands one or two at a time, so this is more likely a bad snapshot or a selector bug than a real backlog. Re-dispatch with dry_run to see the whole set; raising the cap itself is a code change to this workflow."
            printf '%s\n' "${sweep}"
            exit 1
          fi

          printf '%s\n' "${sweep}" | while IFS= read -r tag; do
            [ -z "${tag}" ] && continue
            gh release delete "${tag}" --repo "$GITHUB_REPOSITORY" --yes
            echo "::notice::Swept stuck draft ${tag}: its cycle is closed. Git tag kept."
          done
          echo "Draft-release janitor sweep complete."
