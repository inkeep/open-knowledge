name: Reporter Write-Back

# Tell bug reporters, once, that the fix they reported has shipped.
#
# HOW IT'S TRIGGERED (no edits to the delicate publish path)
#   release.yml (beta) and promote-stable.yml (stable) both already fire a
#   repository_dispatch event_type=desktop-release carrying
#   client_payload.{release_tag, ref}. This piggybacks on that same event, the
#   way linear-release.yml already does, so the publish workflows stay
#   byte-untouched. `release: published` is not an option: GitHub suppresses
#   cascades from GITHUB_TOKEN-authored release events, and repository_dispatch
#   is the documented exemption.
#
#   Only a bare vX.Y.Z runs. A `-beta.N` cut is a no-op: a reporter told their
#   fix is out should be able to install it from the default channel, and a beta
#   is not that.
#
# WHY IT IS DECOUPLED
#   This posts in public under the project's name and it runs after a release
#   has already happened. Nothing it does may reach back into the release: it
#   has its own trigger and its own concurrency group, so it can never queue
#   behind or delay a cut, and no release workflow waits on its result. The
#   worst outcome available to a failure here is that nobody gets told.
#
# EVERYTHING SHIPS INERT
#   With no LINEAR_API_KEY the script emits a notice and enumerates nothing.
#   With the key but no WRITE_BACK_MODE it composes replies and logs them
#   without performing a single write. Live posting therefore needs two
#   deliberate operator actions, so wiring up credentials cannot arm
#   reporter-facing posts by accident. Both steps are in RELEASES.md.

on:
  repository_dispatch:
    types: [desktop-release]
  # Manual backfill / dry-run rehearsal against a specific tag.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Stable release tag to notify reporters about (e.g. v0.36.0)"
        required: true
        type: string

permissions:
  contents: read
  # Posting the reply onto a GitHub issue origin in this repo.
  issues: write

concurrency:
  # Its own group, deliberately not the release cadence group: a write-back run
  # must never be something a release cut can end up waiting on.
  group: reporter-write-back-${{ github.event.client_payload.release_tag || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ github.event.client_payload.release_tag || inputs.release_tag }}
    steps:
      - name: Decide whether this tag is a stable release
        id: tag
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "::error::No release tag (neither client_payload.release_tag nor inputs.release_tag)."
            exit 1
          fi
          if [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${RELEASE_TAG} is not a bare stable tag; reporters are only told about stable releases."
          fi

      - name: Checkout with full history and tags
        if: steps.tag.outputs.stable == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Tag containment is how the shipped version is derived, so every
          # stable tag and the full history behind them have to be present.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.tag.outputs.stable == 'true'
        with:
          node-version: "24"

      - name: Notify reporters whose fix reached this release
        if: steps.tag.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          # Absent by default. Set to `live` on the repo (a variable, not a
          # secret, so it is visible in the settings UI) to arm real posts.
          WRITE_BACK_MODE: ${{ vars.WRITE_BACK_MODE }}
          DISCORD_NOTIFY_URL: ${{ secrets.DISCORD_NOTIFY_URL }}
          DISCORD_NOTIFY_TOKEN: ${{ secrets.DISCORD_NOTIFY_TOKEN }}
        run: node .github/scripts/write-back.mjs
