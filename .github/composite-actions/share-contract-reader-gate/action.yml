name: Share contract reader gate
description: Attest that a deployed Open Knowledge reader accepts the fixed v2 share corpus.

inputs:
  origin:
    description: Absolute deployment origin to probe.
    required: true
  expected-deployment-sha:
    description: Optional deployment SHA that the reader manifest must report.
    required: false
    default: ""
  evidence-name:
    description: Name for the uploaded evidence artifact.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "24"

    - name: Probe reader compatibility
      id: probe
      continue-on-error: true
      shell: bash
      env:
        ORIGIN: ${{ inputs.origin }}
        EXPECTED_DEPLOYMENT_SHA: ${{ inputs.expected-deployment-sha }}
        EVIDENCE_PATH: ${{ runner.temp }}/share-contract-evidence.json
      run: |
        set -euo pipefail
        args=(
          --origin "$ORIGIN"
          --corpus "$GITHUB_ACTION_PATH/../../../test-support/fixtures/share-url-v1-v2.json"
          --evidence "$EVIDENCE_PATH"
        )
        if [[ -n "$EXPECTED_DEPLOYMENT_SHA" ]]; then
          args+=(--expected-deployment-sha "$EXPECTED_DEPLOYMENT_SHA")
        fi
        node "$GITHUB_ACTION_PATH/../../scripts/probe-share-contract.mjs" "${args[@]}"

    - name: Record reader-contract evidence
      if: always()
      shell: bash
      env:
        EVIDENCE_PATH: ${{ runner.temp }}/share-contract-evidence.json
      run: |
        set -euo pipefail
        {
          echo "### Share-contract reader attestation"
          if [[ ! -f "$EVIDENCE_PATH" ]]; then
            echo "- Evidence: missing"
          else
            echo "- Status: \`$(jq -r '.status // "unknown"' "$EVIDENCE_PATH")\`"
            echo "- Epoch: \`$(jq -r '.epoch // "unavailable"' "$EVIDENCE_PATH")\`"
            echo "- Corpus SHA-256: \`$(jq -r '.corpusSha256 // "unavailable"' "$EVIDENCE_PATH")\`"
            echo "- Deployment SHA: \`$(jq -r '.deploymentSha // "unavailable"' "$EVIDENCE_PATH")\`"
            echo "- Probes: \`$(jq -r '[.probes[]?.id] | join(", ") // "unavailable"' "$EVIDENCE_PATH")\`"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload reader-contract evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.evidence-name }}
        path: ${{ runner.temp }}/share-contract-evidence.json
        retention-days: 30
        if-no-files-found: error

    - name: Refuse an incompatible reader
      if: always() && steps.probe.outcome == 'failure'
      shell: bash
      run: exit 1
